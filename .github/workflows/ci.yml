name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Principle of least privilege: workflow only needs to checkout and run tests.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # Don't let one node's failure cancel the other — we want the full signal
      # from both Node versions, not a fail-fast cancellation (#311).
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    # Real Postgres + pgvector for the PostgresAdapter suite (ADR-0005). The
    # suite skips when PLUR_TEST_POSTGRES_URL is unset, so without this service
    # it would be permanently skipped and permanently unproven — which is worse
    # than not having it. With the service set, a broken database FAILS the run
    # instead of quietly skipping.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: plur_test
          POSTGRES_PASSWORD: plur_test_only
          POSTGRES_DB: plur_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plur_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags, so packages/migrate/test/method-list.test.ts can read the
          # 0.15.0 source and actually verify its sync -> async claim. Without
          # them that test takes a no-assertion early return and passes
          # vacuously — which is how a wrong claim about the past reached the
          # CHANGELOG in the first place.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: git config --global user.email "ci@plur.ai"
      - run: git config --global user.name "PLUR CI"
      - run: pnpm build
      # D1-MODULE-CYCLE gate (#353): scope-family predicates were moved to the
      # leaf module scope-util.ts so inject.ts can import isPersonalScope without
      # forming an index → inject → index cycle. madge isn't a repo dep, so we use
      # a tsc --noEmit gate: a reintroduced cycle (or any type error) fails here
      # before the test step.
      - name: Type-check core (module-cycle gate)
        run: pnpm --filter @plur-ai/core exec tsc --noEmit
      # The test suites were never typechecked: tsup emits declarations for src
      # only, and esbuild strips types without checking them. That is ~a third of
      # the repo compiling against types no tool read. It matters most exactly
      # when the API changes shape — a test that drops an `await` on a method
      # that just became async still transpiles, still runs, and still passes,
      # because almost any assertion is true of a pending Promise. Adding this
      # gate surfaced 93 errors, several of them tests that were not testing what
      # they claimed. Keep it ahead of `pnpm test` so the cause is reported
      # instead of the symptom.
      - name: Type-check test suites
        run: pnpm typecheck:tests
      # D1-followup gate (#177): the KNOWN_ISSUES Stage 3b v2 tracking sentinel
      # must be present and point at a GitHub issue. macOS grep lacks -P, so this
      # is a portable Node check (mirrors release.sh).
      - name: KNOWN_ISSUES Stage 3b v2 tracking sentinel
        run: node -e "const s=require('fs').readFileSync('docs/KNOWN_ISSUES.md','utf8'); if(!/STAGE3B_V2_TRACKING:https:\/\/github\.com\//.test(s)){console.error('KNOWN_ISSUES sentinel missing'); process.exit(1)}"
      # Spec JSON Schemas are generated from the Zod source of truth (#315).
      # Regenerate and fail if the committed spec/*.json drifted.
      - name: Check spec schemas are in sync with Zod
        run: |
          pnpm --filter @plur-ai/core gen:schemas
          git diff --exit-code spec/ || {
            echo "::error::spec/*.json is out of sync with the Zod schemas. Run 'pnpm --filter @plur-ai/core gen:schemas' and commit."
            exit 1
          }
      # Four suites (pr1-indexed-migration, read-side-scope-visibility,
      # scope-pushdown, storage-indexed) gate themselves on
      # `require('better-sqlite3')` inside try/catch and SKIP silently when the
      # optionalDependency failed to build. Nothing asserted CI was actually in
      # the ran-them state — a runner image change that breaks the native build
      # would quietly shrink coverage with every job still green. Fail here
      # instead, before the test step, with an unambiguous message.
      - name: Assert better-sqlite3 built — the gated suites must run, not skip
        run: node -e "require('better-sqlite3'); console.log('better-sqlite3 present — the sqlite-gated suites will run')"
        working-directory: packages/core
      - run: pnpm test
        env:
          # Throwaway credentials for the ephemeral service container above —
          # it is reachable only from this job.
          PLUR_TEST_POSTGRES_URL: postgres://plur_test:plur_test_only@127.0.0.1:5432/plur_test
      # Getting-started examples must stay runnable against the public API (#267).
      - name: Run examples
        run: pnpm --filter @plur-ai/examples run all

  # The packaged artefacts, not the source tree.
  #
  # `pnpm test` above proves the SOURCE works. Users install tarballs, and the
  # difference has shipped a defect before: `pg` is an optionalDependency and
  # tsup only auto-externalizes dependencies + peerDependencies, so the driver
  # was inlined into core's dist and PostgresAdapter threw on first use — in the
  # published package, with every in-repo test green.
  #
  # scripts/smoke-release.sh covered exactly that and nothing invoked it, so it
  # could only catch anything when someone remembered to run it by hand. One
  # Node version is enough: this checks packaging, not runtime compatibility.
  # Calibration for the #854 cosine dedup bar. Loads the real BGE-small model,
  # so it is NOT part of the default suite (offline-safe) and NOT part of the
  # test matrix (model download per Node version would be three downloads for
  # one answer).
  #
  # Path-filtered on purpose. The threshold rests on an empirical claim —
  # enriched duplicates land above 0.95, enriched DISTINCT statements below —
  # and that claim can only be invalidated by changing the embedder, the
  # enrichment fields, or the bar itself. Those are exactly the paths below.
  # A code-path regression (comparing bare text again) is caught by the fast
  # stubbed test in dedup-cosine.test.ts, which runs on every PR.
  #
  # Non-blocking: a model fetch is a network dependency, and a check that goes
  # red for reasons unrelated to the diff trains people to ignore red.
  dedup-calibration:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the comparison below needs the PR base commit, which a
          # shallow clone does not have.
          fetch-depth: 0
      - name: Did this diff touch the embedder, the enrichment, or the bar?
        id: relevant
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Compare against the PR BASE, not HEAD^.
          #
          # `git diff HEAD^ HEAD` sees only the most recent commit, so a PR that
          # changed learn-async.ts and then pushed a docs-only follow-up would
          # skip calibration and report green — a check that silently declines to
          # run is indistinguishable from one that passed, which is the failure
          # this job exists to catch elsewhere.
          BASE="$BASE_SHA"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            # New branch, or a base we cannot resolve: fail OPEN and calibrate.
            echo "base '$BASE' unusable — running calibration rather than assuming it is unnecessary"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE" HEAD)
          echo "changed files vs $BASE:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE 'packages/core/src/(embeddings|fts|learn-async)\.ts|packages/core/src/embedders/|packages/core/src/schemas/config\.ts|dedup-threshold-calibration'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "SKIPPING: no change to the embedder, the enrichment fields, or the bar."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.relevant.outputs.run == 'true'
        with:
          # Required: package.json carries no `packageManager` key, so the
          # action cannot infer it. Same pin as the other two jobs.
          version: 9
      - uses: actions/setup-node@v4
        if: steps.relevant.outputs.run == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.relevant.outputs.run == 'true'
      - name: Calibrate the dedup threshold against the real embedder
        if: steps.relevant.outputs.run == 'true'
        env:
          PLUR_EMBEDDER_NETWORK_TESTS: '1'
        run: npx vitest run --project @plur-ai/core packages/core/test/dedup-threshold-calibration.test.ts --reporter=verbose

  smoke-packaged:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: plur_test
          POSTGRES_PASSWORD: plur_test_only
          POSTGRES_DB: plur_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plur_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so this job builds the same artefacts a release build
          # would see (release.sh runs from a full clone with tags). The
          # method-list.test.ts justification the `test` job carries does NOT
          # apply here — this job never runs vitest; the comment used to be a
          # copy-paste of that one, claiming a reason that was not this job's.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pack, install clean, and drive the public API
        run: bash scripts/smoke-release.sh
        env:
          # Same throwaway credentials as the test job — the service container
          # is reachable only from this job.
          PLUR_SMOKE_POSTGRES_URL: postgres://plur_test:plur_test_only@127.0.0.1:5432/plur_test
