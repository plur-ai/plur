    tests: ["packages/cli/test/readonly-commands.test.ts::list and status leave engrams.yaml byte-identical and drop no .lock files"]
  packages/cli/src/commands/status.ts#run:
    kind: guarantee
    rule: "With --quiet, plur status still prints its fields; only the banner is dropped."
    tests: ["packages/cli/test/quiet.test.ts::status --quiet drops the banner but keeps the fields"]
  packages/cli/src/commands/stores.ts#addRemote:
    kind: guarantee
    rule: "plur stores add writes nothing when the token is rejected or the scope is not authorised, and the token is never printed."
    tests: ["packages/cli/test/stores-add-url.test.ts::rejected token: exit 1, nothing written", "packages/cli/test/stores-add-url.test.ts::scope not authorised: exit 1, names the authorised scopes, nothing written", "packages/cli/test/stores-add-url.test.ts::a server echoing the token in any encoding: nothing printed, text or --json"]
  packages/cli/src/commands/stores.ts#flagValue:
    kind: note
    why: "Describes the helper's return value; the refusal happens in its callers."
  packages/cli/src/commands/stores.ts#skippedStoreLines:
    kind: guarantee
    rule: "A folder path in a suggested command is quoted or escaped, never run as shell words when pasted."
    none: "no test pastes the skipped-store command with a hostile path"
  packages/cli/src/commands/sync.ts#run:
    kind: guarantee
    rule: "A failed outbox flush or index pass is always reported, even with --quiet, and does not fail the sync."
    tests: ["packages/cli/test/quiet-sync.test.ts::still prints the index-failure warning under --quiet", "packages/cli/test/outbox-needs-action.test.ts::plur sync says an entry was held back and needs action"]
  packages/cli/src/commands/trust.ts#TRUST_COVERS:
    kind: guarantee
    rule: "A project file can never grant itself trust; only plur trust does."
    tests: ["packages/cli/test/hook-inject-trust.test.ts::does not apply the scope it requests until trusted"]
  packages/cli/src/commands/trust.ts#trusted:
    kind: guarantee
    rule: "plur trust refuses rather than overwrite a folder map it cannot read."
    tests: ["packages/cli/test/folders.test.ts::trust refuses (exit 1) rather than overwriting a malformed folders.yaml"]
  packages/cli/src/commands/ui-server.ts#parseHostValue:
    kind: guarantee
    rule: "A --host with a missing value is refused instead of taking the next flag."
    tests: ["packages/cli/test/ui-host.test.ts::a forgotten value does not swallow the next flag"]
  packages/cli/src/commands/ui-server.ts#planViewer:
    kind: guarantee
    rule: "The Host allowlist never includes the unspecified address, and names are allowed only when the operator vouches for them."
    tests: ["packages/cli/test/ui-host.test.ts::an unspecified bind lists interface addresses, canonical, never the unspecified address", "packages/cli/test/ui-host.test.ts::--allow-host refuses the unspecified address, which no client can send"]
  packages/cli/src/commands/ui-server.ts#urlHostFor:
    kind: note
    why: "Explains why the printed URL uses loopback for an all-interfaces bind; no rule of its own."
  packages/cli/src/commands/ui-server.ts#ViewerPlan:
    kind: guarantee
    rule: "A viewer bound past loopback warns and never reveals the folder."
    tests: ["packages/cli/test/ui-host.test.ts::a widened server never renders the button nor serves the route"]
  packages/cli/src/commands/ui.ts#bound:
    kind: guarantee
    rule: "If the socket did not bind to loopback, the folder-reveal route is refused."
    none: "no test binds a loopback name that resolves off this machine"
  packages/cli/src/commands/ui.ts#openBrowser:
    kind: guarantee
    rule: "A launched browser never writes into our output or holds our pipe open."
    none: "no test checks the browser process's stdio"
  packages/cli/src/commands/ui.ts#plur:
    kind: guarantee
    rule: "Browsing memory with plur ui never writes to the store."
    none: "no test runs plur ui and checks the store is unchanged"
  packages/cli/src/commands/ui.ts#server.allowedHosts:
    kind: guarantee
    rule: "A request whose Host header names another domain, as a rebound browser sends, is refused."
    tests: ["packages/cli/test/ui-host.test.ts::attacker domain in Host, with the fetch-metadata a rebound browser sends"]
  packages/cli/src/commands/untrust.ts#run:
    kind: guarantee
    rule: "plur untrust removes only an exact grant, and when an ancestor grant still covers the folder it says so instead of claiming it was not trusted."
    none: "no test untrusts a folder that an ancestor grant still covers"
  packages/cli/src/commands/upload.ts#plur:
    kind: guarantee
    rule: "An upload preview never registers a project store or changes memory."
    tests: ["packages/cli/test/upload.test.ts::previews eligible scopes without changing memory or configuration bytes"]
    promises: [EFI-11]
  packages/cli/src/commands/verify-manifest.ts#(module):
    kind: guarantee
    rule: "plur verify --manifest exits 0 only when every held memory matches and, for a download, the hash and the expected notary's signature check out; a gateway's own notary is not trusted by default."
    lean: ["PlurSpec/Provenance.lean:exit_zero_iff", "PlurSpec/Provenance.lean:download_exit_zero_iff"]
    tests: ["packages/cli/test/verify-manifest-integrity.test.ts::a non-default gateway naming its own notary is not trusted by default"]
  packages/cli/src/commands/verify.ts#plur:
    kind: guarantee
    rule: "plur verify can never write to the store it examines."
    none: "no test runs plur verify and checks the store is unchanged"
