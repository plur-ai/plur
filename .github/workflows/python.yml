name: Python SDK

on:
  push:
    branches: [main]
    paths: ['packages/python/**', 'packages/langchain/**', '.github/workflows/python.yml']
  # Every pull request, not only those targeting main — a stacked PR (one based
  # on another in-review branch) otherwise runs no CI and reads as verified.
  # See the note in ci.yml.
  pull_request:
    paths: ['packages/python/**', 'packages/langchain/**', 'packages/cli/**', 'packages/core/**', '.github/workflows/python.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: pnpm install --frozen-lockfile
      # Build the CLI (and its core dep) the SDK shells out to.
      - run: pnpm --filter "@plur-ai/cli..." build
      - run: pip install -e packages/python pytest
      - name: Run pytest (against the freshly built CLI)
        env:
          PLUR_CLI: node ${{ github.workspace }}/packages/cli/dist/index.js
        run: pytest packages/python -q
      - run: pip install -e "packages/langchain[dev]"
      - name: Run pytest (langchain adapter)
        run: pytest packages/langchain -q
