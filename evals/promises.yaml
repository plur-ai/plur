- key: agent-behaviour
  name: What an agent with PLUR actually does
  what_it_does: With PLUR attached, a real agent uses what it was taught and keeps what it is told, across sessions.
  promises:
  - id: BEH-1
    promise: An agent asked something that is in memory answers from memory, where the same agent without PLUR cannot.
    kind: agent
    today: holds
    evidence: "Eval 2026-10-15, real Claude sessions, 3 of 3 runs: the agent recalled the seeded fact and answered from it; without PLUR, 3 of 3 did not. Holds only once the folder is switched on for memory: on a first visit the tools ask to turn memory on and the agent declines to answer. (The plur-bench agent arm sets PLUR_HOME, which core does not read, so its memory arm likely never loaded.)"
    decide: "Should this also hold on the first visit to a folder, before memory is switched on there?"

  - id: BEH-2
    promise: When I correct an agent, it saves the correction, and in the next session it does not repeat the mistake.
    kind: agent
    today: holds
    evidence: "Eval 2026-10-15, real Claude sessions, 3 of 3 runs: the correction was saved and the next session followed it. The planted bug (remove the correction instructions) SURVIVED: the scenario says 'Remember that.', so the eval cannot yet tell whether the instructions matter (evals/mutants/manual/README.md)."
    decide: "Drop 'Remember that.' from the scenario, or plant the bug on the save path instead?"

