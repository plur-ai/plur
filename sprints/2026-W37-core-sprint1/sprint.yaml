# Sprint 1 — PLUR core (core track)
#
# FIRST SPRINT IN THIS REPO. Sprints have only ever run in plur-ai/enterprise;
# core never had a cadence, which is part of why 20,381 lines of core work is
# sitting unmerged.
#
# TRACK: core and enterprise run SEPARATE sprint sequences, because the
# development is separate — core engine work and enterprise delivery work have
# different cadences, reviewers and release constraints. The W20-sprint1..
# W36-sprint9 chain is the ENTERPRISE track's history, not a global one. This
# is core's FIRST sprint, hence core-sprint1.
#
# The sprint_id carries the track name because sprint_id doubles as
# miles_routing.sprint_tag_filter and the two repos cross-reference each other
# as overflow_repo — an unqualified "sprint9" would select two different weeks
# of work from two different tracks into one filter.
#
# Unblocks W34-sprint8's close condition: "Sprint cadence paused pending
# roadmap. Do not auto-rollover to W35 until roadmap ships." The roadmap
# shipped 2026-09-01 as 5-plur/roadmap.yaml.
#
# Day-of-week verified: 2026-09-07=Mon, 2026-09-13=Sun, 2026-09-14=Mon
# (via python3 .datacore/lib/date_utils.py dow YYYY-MM-DD)

sprint_id: 2026-W37-core-sprint1
project: 5-plur/2-projects/plur
status: planning        # HELD pending roadmap finalisation — planning | active | review | retro | closed
cadence: 1w
dates:
  start: 2026-09-07
  end: 2026-09-13
  planning: 2026-09-07
  retro: 2026-09-14

# HELD 2026-09-02: not activated. Sprint creation restarts once roadmap.yaml is
# finalised; this file is a prepared draft, not a committed sprint. Do not issue
# GO and do not let a rollover cadence auto-activate it.
held_pending: roadmap-finalisation

goal: |
  Drain the merge queue. Nothing new is built this sprint.

  Thirteen core PRs are open, ALL CI-GREEN, totalling +20,381 lines. Nine sit
  in CHANGES_REQUESTED — a review round nobody closed, which is slower and
  quieter than a missing approval. Among them is the entire W3C provenance
  epic (#1002, +12,804 across 88 files, closing sixteen issues) and both
  pack-trust blockers, which together gate the Ownable and Publishable rungs.

  Planning new work on top of this would plan the wrong work: the roadmap's
  next two milestones are already written and simply have not landed.

roadmap_links: [R-070, R-007, R-041, R-015]
milestone_links: [M3, M4]
okr_links: []          # core has no OKR mapping yet — sprint is roadmap-linked
                       # via roadmap_links above; see R-073 on source of truth.

facilitator:
  operational: miles-on-nightshift
  strategic: plur9
miles_routing:
  primary_repo: plur-ai/plur
  overflow_repo: plur-ai/plur   # same as primary = no cross-track overflow;
                           # core and enterprise run SEPARATE sprint tracks
  sprint_tag_filter: 2026-W37-core-sprint1

backlog:
  # ─── MUST — the three that are clean today ──────────────────────────────
  - id: B1
    ref: github:plur-ai/plur#1002
    title: Land the provenance epic — merge #1000 and #1001, rebase, merge
    owner_role: engineering
    default_claimer: plur9
    state: todo
    priority: must
    effort_estimate: L
    roadmap: R-070
    milestone: M3
    labels: [provenance, epic, p1]
    acceptance: |
      #1000 and #1001 merged first, #1002 rebased onto main, duplicated hunks
      gone. Merged. Sixteen linked issues close.
      Then verify the claim the roadmap has been unable to make: origin, chain
      and signature are actually written on a fresh engram, not merely defined
      in the standard.

  - id: B2
    ref: github:plur-ai/plur#1043
    title: Conformance vectors — golden packs and capsule fixtures
    owner_role: engineering
    default_claimer: miles-on-nightshift
    state: todo
    priority: must
    effort_estimate: M
    roadmap: R-015
    milestone: M4
    labels: [capsule, spec]
    acceptance: |
      Merged. Gives the .plur capsule something to be conformant AGAINST,
      which is the half missing from #1093 — the capsule is implemented and
      nothing calls it.

  - id: B3
    ref: github:plur-ai/plur#1044
    title: Pack lifecycle spec — how an engram changes, provenance on import
    owner_role: engineering
    default_claimer: miles-on-nightshift
    state: todo
    priority: must
    effort_estimate: M
    roadmap: R-070
    milestone: M4
    labels: [packs, spec]
    acceptance: |
      Merged. Specifies the behaviour whose absence is the live defect:
      _installPackDir deletes the provenance directory a pack ships, so every
      record written for the recipient is invisible to them.

  # ─── MUST — the security pair that gates the whole hub track ────────────
  - id: B4
    ref: github:plur-ai/plur#1108
    title: Close the prompt-structure forgery class at the render boundary
    owner_role: engineering
    default_claimer: plur9
    state: todo
    priority: must
    effort_estimate: M
    roadmap: R-007
    milestone: M4
    blocker: CHANGES_REQUESTED — requested changes not yet addressed
    labels: [security, p1, pack-trust]
    acceptance: |
      Requested changes addressed, merged. This is #940: a statement
      containing a newline followed by "[" can forge a second engram entry at
      SYSTEM-PROMPT authority. With B5 it clears the pack-trust gate.

  - id: B5
