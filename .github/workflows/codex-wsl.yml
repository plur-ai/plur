name: Codex WSL2 upgrade

on:
  pull_request:
    paths:
      - 'packages/cli/**'
      - 'packages/core/**'
      - 'packages/mcp/**'
      - 'pnpm-lock.yaml'
      - 'scripts/codex-*.mjs'
      - 'scripts/windows-editors-probe.mjs'
      - '.github/workflows/codex-wsl.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-wsl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codex-wsl:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: fresh
            filesystem: linux
          - scenario: from-0.19.4
            filesystem: linux
          - scenario: from-0.19.4
            filesystem: mounted
    steps:
      - name: Preserve Unix line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          additional-packages: curl ca-certificates xz-utils git bubblewrap
          use-cache: false
      - name: Verify WSL2 and install Linux Node
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          uname -a
          uname -r | grep -qi 'WSL2'
          mkdir -p /opt/plur-node
          cd /opt/plur-node
          curl -fsSLO https://nodejs.org/dist/v24.13.0/node-v24.13.0-linux-x64.tar.xz
          curl -fsSLO https://nodejs.org/dist/v24.13.0/SHASUMS256.txt
          grep ' node-v24.13.0-linux-x64.tar.xz$' SHASUMS256.txt | sha256sum -c -
          tar -xJf node-v24.13.0-linux-x64.tar.xz --strip-components=1
          export PATH=/opt/plur-node/bin:/usr/local/bin:/usr/bin:/bin
          npm install -g --no-audit --no-fund pnpm@9.15.9 @openai/codex@0.160.1
      - name: Build and pack this PR inside WSL2
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          export PATH=/opt/plur-node/bin:/usr/local/bin:/usr/bin:/bin
          # Build on Linux storage; probe fixtures separately cover /mnt/c.
          mkdir -p /opt/plur-source
          cp -a . /opt/plur-source/
          cd /opt/plur-source
          pnpm --filter plur --filter '@plur-ai/cli...' --filter '@plur-ai/mcp...' --filter '@plur-ai/opencode...' install --frozen-lockfile
          node scripts/ci-stamp-version.mjs ci.wsl > /opt/plur-ci-version
          pnpm --filter '@plur-ai/cli...' --filter '@plur-ai/mcp...' --filter '@plur-ai/opencode...' build
          mkdir -p /opt/plur-tarballs
          for package in core mcp cli opencode; do
            (cd "packages/$package" && pnpm pack --pack-destination /opt/plur-tarballs)
          done
          npm install -g --no-audit --no-fund /opt/plur-tarballs/plur-ai-core-*.tgz /opt/plur-tarballs/plur-ai-mcp-*.tgz /opt/plur-tarballs/plur-ai-cli-*.tgz
      - name: Upgrade, hooks, token forwarding and real Codex memory roundtrip
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          export PATH=/opt/plur-node/bin:/usr/local/bin:/usr/bin:/bin
          export PLUR_TARBALLS=/opt/plur-tarballs PLUR_EDITORS_REQUIRED=codex
          set -a
          source /opt/plur-ci-version
          set +a
          if [ '${{ matrix.filesystem }}' = mounted ]; then
            mkdir -p "$PWD/mounted-test-temp"
            export TMPDIR="$PWD/mounted-test-temp"
          fi
          cd /opt/plur-source
          node scripts/windows-editors-probe.mjs --scenario '${{ matrix.scenario }}'
          node --experimental-transform-types scripts/codex-upgrade-probe.mjs
