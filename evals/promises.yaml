- key: agent-behaviour
  name: What an agent with PLUR actually does
  what_it_does: With PLUR attached, a real agent uses what it was taught and keeps what it is told, across sessions.
  promises:
  - id: BEH-1
    promise: An agent asked something that is in memory answers from memory, where the same agent without PLUR cannot.
    kind: agent
    today: holds
    evidence: 'Graders rebuilt 2026-10-17 (audit B-02): the answer is judged by meaning including negation (''Never Tuesday; deploy Friday'' fails), the fact must come back in a successful PLUR reply, memory is switched on for the folder before the run (consent is a prerequisite, checked), and fewer than 3 runs is non-certifying. Proven on synthetic transcripts (evals/helpers/agent-behaviour-graders.unit.test.ts). Graders rebuilt again 2026-10-18 (audit R-01): prose heuristics still passed ''Tuesday is forbidden'' and rejected right answers that mentioned today''s weekday, so the prompt now ends with an answer contract (final line ''ANSWER: <weekday>'' or ''ANSWER: UNKNOWN'') and only that line is graded, exactly; a lookup counts only if its JSON payload succeeded and returned a memory holding the complete seeded fact (echoed queries and truncated statements do not count); the control fails only an answer claiming Tuesday. Real run 2026-10-18 under these graders (claude CLI, sonnet, subscription login): memory arm 3/3 (recalled via plur_recall, ANSWER: Tuesday); control without PLUR 3/3 answered UNKNOWN. Run by the eval author; an independent run is not verified.'

  - id: BEH-2
    promise: When I correct an agent, it saves the correction, and in the next session it does not repeat the mistake.
    kind: agent
    today: holds
    evidence: 'Rebuilt 2026-10-17 (audit B-02): the correction no longer says ''Remember that.'' (that is BEH-3); session 1 needs a SUCCESSFUL plur_learn whose statement carries the corrected rule (opposite rule fails, failed call fails) and the memory found on disk after reopening the store; session 2 must write exactly mailer.cfg with the requested line and retrieve the saved memory through PLUR. Graders proven on synthetic transcripts, including the audit''s three false positives. Planted bug evals/mutants/manual/BEH-2-2.patch (save acknowledged, never written) is rejected by the grader unit test; the real-agent kill is pending. 2026-10-18 (audit R-01): a saved statement is judged with negation before OR after the term (''Files ending in .cfg are forbidden'' fails); retrieval needs a successful JSON payload returning the complete saved statement (an error echoing the query, or a truncated statement, fails); mailer.cfg must hold exactly one smtp_host assignment, value localhost, and nothing else. Real run 2026-10-18 under these graders: 3/3 (saved and on disk, mailer.cfg with exactly smtp_host = localhost, memory retrieved via plur_recall); the no-PLUR control wrote mailer.conf. Run by the eval author; an independent run and the real-agent BEH-2-2 kill are not verified.'
  - id: BEH-3
    promise: When I tell my agent to remember something, it is saved, and in the next session it uses it.
    kind: agent
    today: holds
    evidence: 'Eval written 2026-10-17 (explicit-save scenario: ''Remember this: Larkspur keeps its log files for 11 days.''). Session 1 needs a successful plur_learn carrying the fact and the memory on disk after reopening; session 2 must retrieve it through PLUR and write 11 into retention.txt; a no-PLUR control must not write 11. Same strict graders as BEH-2, three runs. 2026-10-18 (audit R-01): the saved statement must name Larkspur; retrieval as BEH-2 (complete statement in a successful payload); retention.txt must be exactly 11 (''Not 11. Unknown.'' fails). Real run 2026-10-18: 3/3 (fact saved and on disk, retrieved via plur_recall, retention.txt exactly 11); the graded no-PLUR control wrote nothing. Run by the eval author; an independent run is not verified.'


