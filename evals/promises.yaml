  what_it_does: I can turn memory off for a folder; there, nothing is read or written and the agent is told so plainly.
  promises:
  - id: OFF-1
    promise: In a folder where I turned memory off, nothing is read from or written to memory, including team servers.
    kind: deterministic
    today: holds
    evidence: mcp/test/folder-off.test.ts.
  - id: OFF-2
    promise: Starting PLUR in a folder where memory is off does not touch memory at all.
    kind: deterministic
    today: broken
    evidence: Issue 1523 (server startup touches memory in an off folder).
  - id: OFF-3
    promise: If my folder settings are broken, memory pauses and tells me which line is wrong and how to fix it.
    kind: deterministic
    today: holds
    evidence: mcp/test/folder-off.test.ts.
  - id: OFF-4
    promise: In a folder I have not decided about yet, nothing is read from or written to memory until I choose, and my choice applies only to that folder.
    kind: deterministic
    today: holds
    evidence: 'Eval 2026-10-17 via the MCP server (packages/mcp/README.md ~79, ~92; folder-gate.ts; server.ts gate). Undecided folder A: learn, recall, recall_hybrid, inject, inject_hybrid, session_start and plur_admin (capture, timeline, similarity_search, learn, recall; lean profile) all answer the folder question, return no memory text, change no memory file, write no folders.yaml, send nothing to the team server, and call nothing on the engine but the folder lookup and config reads. After answering yes for A (the offered command, run as plur folders set runs it): memory runs in A directly and through plur_admin; the map gains an entry for A only; sibling B stays ask and a new session in B gets the question; A''s nonce is refused for B and from another session. Mutants OFF-4-1..3 killed.'

- key: team
  name: Team stores and being offline
  what_it_does: Team memories on a server are searched alongside mine; when the server is slow or gone, I still get my own answers and am told what was missing.
  promises:
  - id: TEAM-1
    promise: If the team server is down or slow, I still get my local answers within a bounded time.
    kind: deterministic
    today: holds
    evidence: recall-deadline-1586.test.ts, remote-recall.test.ts.
  - id: TEAM-2
    promise: An answer never claims to be complete when the team server was not reached, and says what happened.
    kind: deterministic
    today: holds
    evidence: recall-deadline-1586.test.ts; ADR-0006.
  - id: TEAM-3
    promise: A team memory saved while the server is down is delivered later, exactly once.
    kind: deterministic
    today: holds
    evidence: outbox.test.ts, outbox-idempotency.test.ts; Lean theorem honour_at_most_once. Open issues 1628, 1509, 1321 on stuck deliveries.
  - id: TEAM-4
    promise: A search limited to my personal scopes (my user scope, and local project scopes not tied to a team store) never sends my question to a team server.
    kind: deterministic
    today: holds
    evidence: 'Eval 2026-10-17: with a team server mounted and live recall on, keyword search, hybrid search and hybrid inject limited to user:me, to a local project scope (project:hobby, no team store), to an allow-list of both, to an allow-list of global + user:me, or to global, send zero requests to the team server and still find my memory. Controls: a search in the team scope and in project:acme/payments (a team''s org) do reach it. A project inside a team''s org is not personal under this definition. Mutants TEAM-4-1..3 killed.'

  - id: TEAM-5
    promise: With no internet at all, I can still save and find memories; PLUR tries the network at most once (the update check), and when that cannot connect it assumes it is offline and makes no further call.
    kind: deterministic
    today: broken
    evidence: "Eval 2026-10-15 red: the MCP server checks npm for updates on every start, with no way to turn it off (packages/mcp/src/server.ts ~224). The engine itself, with fetch, sockets and DNS blocked, saves, finds and injects with zero network calls. First-run model download not covered."
    decide: 'Decided 2026-10-19 (decision board A1): the update check runs at start again; when it cannot connect, PLUR assumes offline mode.'


- key: sync
  name: Sync
  what_it_does: Sync keeps my memories in a git repository; a shared repository gets only what is cleared for sharing.
  promises:
  - id: SYN-1
    promise: Syncing to a shared repository publishes only memories cleared for sharing, never private or personal ones.
    kind: deterministic
    today: holds
    evidence: evals/sync SYN-1 (includes a shared-scope memory with no visibility field); 2 planted bugs caught. Older note — sync.test.ts mixed fixture lacked that case.
  - id: SYN-2
    promise: Secrets and machine settings are never synced.
    kind: deterministic
    today: holds
    evidence: evals/sync SYN-2, also a repository where an older client had committed config.yaml; 2 planted bugs caught. secrets.test.ts.
  - id: SYN-3
    promise: When a sync cannot push, it says so instead of reporting success, and a damaged store is never published.
    kind: deterministic
    today: holds
    evidence: evals/sync SYN-3; 2 planted bugs caught. sync-push-failure.test.ts, sync-corrupt-push-guard.test.ts.
  - id: SYN-4
    promise: Private memories never leave my machine through sync to a shared repository; my own personal repository mirrors them.
    kind: deterministic
    today: broken
    decide: 'Decided 2026-10-19 (decision board A4): mirror private memories to my own repository. Machine-local memories and side records stay home either way (SYN-6).'
    evidence: "evals/sync SYN-4 is red: a private personal memory left the machine through sync to a personal repository. The shared-repository case is green. sync.ts header comment; sync.test.ts warning case."
  - id: SYN-5
    promise: After two devices save, correct or forget memories offline, syncing keeps both devices' changes and never brings back a forgotten memory.
    kind: deterministic
    today: broken
    evidence: 'evals/sync SYN-5 is red in both orders: device A saves X and forgets Y, device B (joined by cloning the personal repository) saves Z and corrects W, then both sync. The second device''s sync throws: ''a sync failed: device B: Sync conflict: YAML files have merge conflicts that require manual resolution. Your local changes are preserved.'' (A first; ''device A: ...'' when B syncs first). sync.ts merges engrams.yaml line by line through git (pullRebaseClean), so two devices appending memories offline always conflict. The same assertions pass when the devices sync one after the other (checked by hand, not committed).'
