anchors:
  packages/core/src/actor-keys.ts#(module):
    kind: guarantee
    rule: >-
      A private signing key is stored owner-only and never synced with the store; a signature from an unknown identity
      is reported as a named failure, not skipped.
    tests:
      - "packages/core/test/actor-keys.test.ts::with --signatures: unknown signer is \"unknown_signer\", NOT a chain break"
      - packages/core/test/actor-keys.test.ts::sets private key file mode to 0600
  packages/core/src/actor-keys.ts#existing:
    kind: guarantee
    rule: Initialising a key for an identity that already has a valid key reuses it and does not overwrite it.
    tests:
      - >-
        packages/core/test/actor-keys.test.ts::is idempotent: second call returns the same public key without
        overwriting
  packages/core/src/actor-keys.ts#initActorKey:
    kind: guarantee
    rule: >-
      Initialising a key for an identity that already has a valid key reuses it; a new private key is written with
      owner-only permissions.
    tests:
      - >-
        packages/core/test/actor-keys.test.ts::is idempotent: second call returns the same public key without
        overwriting
      - packages/core/test/actor-keys.test.ts::sets private key file mode to 0600
  packages/core/src/actor-keys.ts#keysDirFor:
    kind: guarantee
    rule: >-
      A relative keys folder is resolved against the store, never against the process working directory, so every
      process finds the same keys.
    tests:
      - packages/core/test/verify-review-0.23.test.ts::resolves against the store, not the process working directory
  packages/core/src/actor-keys.ts#loadKeysRegistry:
    kind: note
    why: Describes loading behaviour (missing file is empty, unparseable file throws); the hard-rule wording is incidental.
  packages/core/src/actor-keys.ts#loadPrivateKeyBuffer:
    kind: guarantee
    rule: A private key readable by group or world is refused for signing.
    tests:
      - packages/core/test/actor-keys.test.ts::throws when the key file has wrong permissions (group-readable)
      - packages/core/test/actor-keys.test.ts::throws when the key file has world-readable permissions
  packages/core/src/actor-keys.ts#registerPublicKey:
    kind: guarantee
    rule: Registering a public key writes the registry atomically, and re-registering the same key changes nothing.
    tests:
      - packages/core/test/actor-keys.test.ts::registering the same identity with the same key is a no-op (idempotent)
      - packages/core/test/actor-keys.test.ts::writes keys.yaml atomically and with required fields
  packages/core/src/actor-keys.ts#registry:
    kind: guarantee
    rule: A keys registry that cannot be parsed is refused and left as it is, never replaced by a fresh one.
    tests:
      - packages/core/test/actor-keys-audit.test.ts::refuses to overwrite an unparseable keys.yaml
  packages/core/src/actor-keys.ts#safeFileName:
    kind: guarantee
    rule: Two different identities never map to the same key file name, and no file name contains a colon.
    tests:
      - packages/core/test/actor-keys-audit.test.ts::key file names carry no colon and distinct identities never collide
  packages/core/src/actor-keys.ts#tmp:
    kind: guarantee
    rule: A private key file is written through a temp file and rename, so a crash never leaves a partial key.
    none: no test interrupts the key write
  packages/core/src/async-mutex.ts#KeyedAsyncMutex.run:
    kind: guarantee
    rule: Evicting an idle per-key lock never lets two waiters on the same key hold different locks at once.
    none: no test races eviction against a new waiter on the same key
  packages/core/src/atomic-write.ts#(module):
    kind: guarantee
    rule: >-
      On Windows, a credential write over a destination whose access list cannot be inspected is refused rather than
      written unprotected.
    lean:
      - PlurSpec/Persistence.lean:refused_leaves_dest
      - PlurSpec/Persistence.lean:unknown_creates_nothing
    tests:
      - "packages/core/test/codex2-atomic-first-write.test.ts::icacls output names no account (unparseable): refuses"
  packages/core/src/atomic-write.ts#ALLOW_UNPROTECTED_ENV:
    kind: guarantee
    rule: >-
      A credential write whose owner-only protection cannot be established is refused unless the owner opted out, and
      every unprotected write the opt-out allows is reported.
    lean:
      - PlurSpec/Persistence.lean:allow_off_is_default
      - PlurSpec/Persistence.lean:allow_wide_is_reported
    tests:
      - packages/core/test/config-owner-only.test.ts::still refused
  packages/core/src/atomic-write.ts#AtomicWriteOptions:
    kind: guarantee
    rule: >-
      A credential write on Windows makes the temp file owner-only and verifies it before writing any byte, or is
      refused with the destination untouched.
    lean:
      - PlurSpec/Persistence.lean:secret_write_owner_only
      - PlurSpec/Persistence.lean:secret_unprotectable_refused
    tests:
      - >-
        packages/core/test/codex2-atomic-first-write.test.ts::secret write that cannot be protected (shared destination,
        grant fails): refused, destination unchanged
  packages/core/src/atomic-write.ts#REFUSED_CREDENTIAL_WRITE:
    kind: guarantee
    rule: The error for a refused credential write names the cause and the opt-out and never contains the content.
    tests:
      - >-
        packages/core/test/config-owner-only.test.ts::a refused registerEnterpriseServer names the cause and the
        opt-out, never the key
  packages/core/src/atomic-write.ts#atomicWrite:
    kind: guarantee
    rule: >-
      A store write either fully replaces the file or leaves it as it was, never half-written or empty after a crash,
      never loosens the existing file mode, and leaves no temp file behind on failure.
    lean:
      - PlurSpec/Persistence.lean:secret_write_owner_only
    tests:
      - >-
        packages/core/test/codex2-atomic-first-write.test.ts::a 0644 destination still ends at 0644 (mode preserved,
        never widened mid-write)
      - >-
        packages/core/test/codex2-atomic-first-write.test.ts::never writes through a link planted at the temp name
        (exclusive create)
      - packages/core/test/telemetry-atomic-write.test.ts::never reuses a tmp path across writes to the same file
    promises:
      - DUR-2
  packages/core/src/atomic-write.ts#fsyncDir:
    kind: note
    why: Explains why a failed directory fsync is best-effort and not an error; states no rule of its own.
  packages/core/src/atomic-write.ts#refuseUnprotected:
    kind: guarantee
    rule: >-
      A Windows credential write whose protection cannot be established throws and writes nothing, unless the opt-out is
      set, in which case it is reported.
    lean:
      - PlurSpec/Persistence.lean:secret_unprotectable_refused
      - PlurSpec/Persistence.lean:allow_wide_is_reported
    tests:
      - packages/core/test/config-owner-only.test.ts::a refusal is one line that names the cause and the opt-out
  packages/core/src/atomic-write.ts#winAccount:
    kind: guarantee
    rule: >-
      Ordinary writes never run the Windows access-list tool; credential writes always get a verified owner-only temp
      file or are refused with nothing written.
    lean:
      - PlurSpec/Persistence.lean:ordinary_never_refused
      - PlurSpec/Persistence.lean:secret_write_owner_only
    tests:
      - packages/core/test/codex2-atomic-first-write.test.ts::ordinary writes never call icacls
      - >-
        packages/core/test/codex2-atomic-first-write.test.ts::protection that cannot be verified: refuses, writes
        nothing, destination unchanged
  packages/core/src/backend-selection.ts#(module):
    kind: guarantee
    rule: PGLite is never chosen by store size, only when explicitly requested.
    tests:
      - packages/core/test/backend-selection.test.ts::never selects PGLite by size, at any corpus size
  packages/core/src/backend-selection.ts#resolveBackendTier:
    kind: guarantee
    rule: >-
      Choosing a backend never throws, never picks PGLite by size, and a fallback from the requested tier is always
      reported.
    tests:
      - packages/core/test/backend-selection.test.ts::never selects PGLite by size, at any corpus size
      - >-
        packages/core/test/backend-selection.test.ts::caps at SQLite when the corpus wants Postgres but nothing is
        configured
      - >-
        packages/core/test/backend-selection.test.ts::is total: nonsense counts degrade to the smallest tier rather than
        throwing
  packages/core/src/backend-selection.ts#v:
    kind: guarantee
    rule: >-
      A backend override from the environment or config always wins over size, regardless of case or surrounding
      whitespace.
    tests:
      - packages/core/test/backend-selection.test.ts::honours every tier name from the env var, whatever the size says
  packages/core/src/backup.ts#(module):
    kind: guarantee
    rule: >-
      A daily backup is taken only of a store that passes validation, under the store lock so never of a half-written
      file, and never by a read-only instance.
    tests:
      - packages/core/test/backup.test.ts::REFUSES to snapshot a corrupt store, leaving the last good one intact
      - packages/core/test/backup.test.ts::takes at most one snapshot per day
  packages/core/src/backup.ts#SHRINK_TOLERANCE:
    kind: guarantee
    rule: A snapshot of a store that shrank more than the tolerance against the last known-good count is refused.
    lean:
      - PlurSpec/Persistence.lean:truncation_refused
    tests:
      - packages/core/test/backup.test.ts::REFUSES a snapshot of a truncated store, using the last good count
  packages/core/src/backup.ts#aside:
    kind: guarantee
    rule: >-
      An unverifiable same-day snapshot is set aside and replaced with a fresh verified one, so the day does not end
      without a usable backup.
    tests:
      - >-
        packages/core/test/audit-backup-snapshot.test.ts::replaces an unverifiable same-day snapshot with a fresh
        verified one, keeping the old bytes aside
  packages/core/src/backup.ts#baseline:
    kind: guarantee
    rule: >-
      A shrink made by PLUR itself moves the backup baseline, while a file smaller than what PLUR last wrote is still
      refused.
    lean:
      - PlurSpec/Persistence.lean:replay_rebaselines
      - PlurSpec/Persistence.lean:replay_truncation_refused
    tests:
      - >-
        packages/core/test/formal-apply-budget-backup.test.ts::a legitimate >10% removal by PLUR re-baselines: the next
        day is snapshotted
      - packages/core/test/formal-apply-budget-backup.test.ts::an external truncation (no PLUR write) is still refused
  packages/core/src/backup.ts#invalid:
    kind: guarantee
    rule: >-
      The backup gate judges each entry by the same rule the loader uses, so it never accepts entries the loader would
      drop.
    tests:
      - packages/core/test/backup.test.ts::rejects schema-invalid entries
  packages/core/src/backup.ts#maybeDailyBackup:
    kind: guarantee
    rule: A backup failure never makes the triggering write fail, and a store that fails the gate is reported.
    none: no test makes the snapshot itself throw and checks the write still succeeds
  packages/core/src/backup.ts#plan:
    kind: guarantee
    rule: A restore runs under the store lock and replaces the store atomically, refusing a backup that does not verify.
    tests:
      - packages/core/test/backup.test.ts::refuses to restore a backup whose bytes do not match its sidecar
      - packages/core/test/backup.test.ts::refuses to restore a backup that does not itself validate
  packages/core/src/backup.ts#recordLastWritten:
    kind: note
    why: Describes a best-effort bookkeeping helper that swallows its own errors; no user-facing rule.
  packages/core/src/backup.ts#restoreBackup:
    kind: guarantee
    rule: >-
      A restore is refused unless the backup verifies (unless forced), and the current store is moved aside, never
      deleted.
    tests:
      - packages/core/test/backup.test.ts::restores and keeps the pre-restore store aside
      - packages/core/test/backup.test.ts::refuses to restore a backup whose bytes do not match its sidecar
  packages/core/src/backup.ts#sameDay:
    kind: guarantee
    rule: An intact same-day snapshot is never overwritten, even when the backup state file is lost.
    tests:
      - >-
        packages/core/test/audit-backup-snapshot.test.ts::never overwrites a same-day recovery snapshot when state
        metadata is lost
  packages/core/src/backup.ts#strongest:
    kind: guarantee
    rule: >-
      A missing or corrupt backup state file does not disable the shrink check; the strongest existing snapshot's count
      is used as the baseline.
    none: no test removes the state file and checks a truncated store is still refused
  packages/core/src/backup.ts#validateStore:
    kind: guarantee
    rule: >-
      A store file that does not parse, has invalid entries or empty ids, is empty or lacks a final newline, or shrank
      past tolerance, is not fit to back up or restore from.
    tests:
      - packages/core/test/backup.test.ts::rejects a zero-length file
      - packages/core/test/backup.test.ts::rejects schema-invalid entries
      - packages/core/test/backup.test.ts::flags a file that does not end in a newline
  packages/core/src/backup.ts#writeFileDurable:
    kind: guarantee
    rule: A snapshot file is published atomically and durably, so a crash never leaves a partial snapshot.
    none: no test interrupts a snapshot write
  packages/core/src/capsule.ts#WriteCapsuleOptions:
    kind: note
    why: "Documents a known limitation: capsule signatures are carried and length-checked but not verified."
  packages/core/src/capsule.ts#signerPresent:
    kind: guarantee
    rule: A capsule whose signed flag disagrees with its signer is refused as ambiguous, with that defect named.
    tests:
      - >-
        packages/core/test/capsule.test.ts::SIGNED set with signer: null is refused as an ambiguous envelope, not as a
        size mismatch
      - packages/core/test/capsule.test.ts::a signer with SIGNED clear is refused too
  packages/core/src/claude-user-config.ts#RegisterClaudeUserMcpOptions:
    kind: guarantee
    rule: >-
      Registering PLUR in the Claude user config keeps every other key, refuses malformed files untouched, re-applies
      once over a concurrent change and then refuses.
    tests:
      - >-
        packages/core/test/claude-user-config-1564.test.ts::L5: an mcpServers that is not an object is refused,
        untouched, with no backup
      - packages/core/test/claude-user-config-1564.test.ts::changed again after the one re-apply → refused
  packages/core/src/config-file.ts#writeConfigFile:
    kind: guarantee
    rule: >-
      Every write of the config file leaves it owner-only, and on Windows a write whose temp file cannot be made
      owner-only is refused.
    lean:
      - PlurSpec/Persistence.lean:every_config_writer_protected
      - PlurSpec/Persistence.lean:helper_never_silent
    tests:
      - >-
        packages/core/test/config-owner-only.test.ts::a 0644 config.yaml is 0600 after a store write, and stays 0600
        after a rewrite
      - >-
        packages/core/test/config-owner-only.test.ts::protection that cannot be established: the write is refused and
        config.yaml is unchanged
  packages/core/src/config.ts#loadConfig:
    kind: guarantee
    rule: >-
      A malformed store entry or field in the config loses at most that entry or field, never the whole config or the
      other store registrations.
    lean:
      - PlurSpec/StoreEntry.lean:load_ok_fixed
    tests:
      - packages/core/test/formal-store-entry.test.ts::drops the field, not every store
      - packages/core/test/pr3-config-robustness.test.ts::a bad forbid category does NOT drop the entry
  packages/core/src/config.ts#storeEntryForDisk:
    kind: guarantee
    rule: The in-memory scope-expansion marker is never written to the config file.
    none: no test checks the expansion marker is absent from the written config
  packages/core/src/content-fields.ts#LEARN_CONTEXT_FIELD_ROLES:
    kind: note
    why: >-
      Explains the field-role table and that the compiler keeps it complete; the 'never persisted' wording describes a
      session key, not a rule of this code.
  packages/core/src/content-fields.ts#LEARN_CONTEXT_FIELD_ROLES.related:
    kind: note
    why: Labels the field; the 'never-overwrite' wording names the batch linking behaviour implemented elsewhere.
  packages/core/src/content-fields.ts#PLUR_BOOKKEEPING_KEYS:
    kind: guarantee
    rule: >-
      Only the enumerated PLUR bookkeeping keys are exempt from the content scan; any other structured-data key,
      including an unknown underscore key, is scanned.
    tests:
      - packages/core/test/leak-surface.test.ts::scans an unknown _key and skips the known ones
  packages/core/src/content-fields.ts#engramContentFields:
    kind: guarantee
    rule: >-
      Every field on an engram except PLUR's own bookkeeping keys is included in the content scan, so a new field cannot
      escape it.
    tests:
      - >-
        packages/core/test/leak-surface.test.ts::the engram-side scan strips only PLUR bookkeeping keys, and keeps user
        structured_data
  packages/core/src/deadline.ts#withDeadline:
    kind: guarantee
    rule: >-
      A deadline race resolves with the value or a distinct missed-deadline marker, propagates an early rejection, and
      always clears its timer.
    tests:
      - >-
        packages/core/test/deadline.test.ts::returns DEADLINE_MISSED when the deadline passes first and clears its timer
        either way
      - packages/core/test/deadline.test.ts::propagates a rejection that arrives before the deadline
  packages/core/src/decay.ts#daysSince:
    kind: guarantee
    rule: A memory with an unparseable access date is still eligible for injection rather than silently never injected.
    lean:
      - PlurSpec/ScopeInject.lean:decay_total
    tests:
      - packages/core/test/formal-scopeinject-decay.test.ts::an engram with a malformed last_accessed is still injected
    promises:
      - FDB-5
  packages/core/src/decay.ts#decayedStrength:
    kind: guarantee
    rule: Decay never raises a memory's strength and never takes a strength above the floor below it.
    lean:
      - PlurSpec/ScopeInject.lean:decay_nonincreasing_above_floor
      - PlurSpec/ScopeInject.lean:decay_above_floor_bounded
      - PlurSpec/ScopeInject.lean:sub_floor_stays
    tests:
      - packages/core/test/formal-apply-budget-decay.test.ts::a strength of 0 does not rise with time
      - >-
        packages/core/test/formal-apply-budget-decay.test.ts::good case: a strength above the floor still decays toward
        it, never below
    promises:
      - FDB-3
  packages/core/src/dedup.ts#DEDUP_DECISION_GUIDE:
    kind: guarantee
    rule: No duplicate-check decision rewrites an existing memory; an update saves a new memory that supersedes the old.
    promises:
      - LRN-8
  packages/core/src/embeddings.ts#CACHE_LOCK_OPTS:
    kind: guarantee
    rule: An embedding-cache write waits at most a short bounded time for its lock and is skipped rather than waited out.
    none: no test holds the cache lock and checks the save is skipped promptly
  packages/core/src/embeddings.ts#_setCachedEmbedder:
    kind: note
    why: A test-only hook; 'production code never calls this' is a convention for maintainers.
  packages/core/src/embeddings.ts#activeEmbedderDim:
    kind: guarantee
    rule: An external vector column is sized to the dimension the active embedder produces, never to the default constant.
    tests:
      - packages/core/test/embed-dim-contract.test.ts::PLUR_EMBEDDER=bge-base → 768 column, NOT the 384 constant
  packages/core/src/embeddings.ts#allowBackgroundModelLoad:
    kind: guarantee
    rule: A short-lived CLI or hook process never downloads the embedding model.
    tests:
      - >-
        packages/core/test/recall-model-missing-1587.test.ts::keyword results at once, with the reason and the next
        step; no process spawned, no download
    promises:
      - REC-3
  packages/core/src/embeddings.ts#appendEntries:
    kind: guarantee
    rule: A record appended to the embedding delta file is never swallowed by a line a killed process left unfinished.
    tests:
      - >-
        packages/core/test/recall-deadline-1586-round7.test.ts::a partial line, then an append: the appended record is
        recovered
  packages/core/src/embeddings.ts#cacheProgress:
    kind: guarantee
    rule: >-
      Vectors computed by a recall that hits its deadline are saved atomically before the reply, so each cut-off recall
      makes progress.
    tests:
      - >-
        packages/core/test/recall-deadline-1586-round7.test.ts::many cut-off recalls: the delta is folded in once it
        passes the threshold
  packages/core/src/embeddings.ts#deferFold:
    kind: guarantee
    rule: The deferred embedding-cache fold never keeps a process alive.
    none: no test checks the fold timer is unref'd
  packages/core/src/embeddings.ts#embeddingSearch:
    kind: guarantee
    rule: A queued remote-only save is never embedded or written to the embedding cache.
    tests:
      - >-
        packages/core/test/remote-only-derived-copies.test.ts::fillEmbeddingCache and embeddingSearch skip it, and the
        cache holds no entry for it
  packages/core/src/embeddings.ts#embeddingSearchWithScores:
    kind: guarantee
    rule: A queued remote-only save is never embedded or written to the embedding cache.
    none: no test exercises the scored embedding search with a queued remote-only save
  packages/core/src/embeddings.ts#fillEmbeddingCache:
    kind: guarantee
    rule: >-
      Background cache filling stops at the first failure and is never retried, and never embeds a queued remote-only
      save.
    tests:
      - >-
        packages/core/test/remote-only-derived-copies.test.ts::fillEmbeddingCache and embeddingSearch skip it, and the
        cache holds no entry for it
  packages/core/src/embeddings.ts#maybeStartBackgroundModelLoad:
    kind: guarantee
    rule: The background model load starts at most once per process, is never awaited by a recall, and is never retried.
    tests:
      - >-
        packages/core/test/recall-model-missing-1587.test.ts::starts at most one in-process load, and recall never waits
        for it
  packages/core/src/embeddings.ts#mergeEmbeddingsIntoCache:
    kind: guarantee
    rule: An older delta record is never applied over an imported embedding vector.
    tests:
      - >-
        packages/core/test/recall-deadline-1586-round7.test.ts::the migration import is not overridden by an older delta
        record
  packages/core/src/embeddings.ts#rawScore:
    kind: note
    why: States an empirical fact about cosine scores on same-language text to justify clamping.
  packages/core/src/embeddings.ts#readDisabledFromEnv:
    kind: note
    why: Describes which spellings disable embeddings; 'cannot be retested' is a note about testing.
  packages/core/src/embeddings.ts#semanticModelState:
    kind: guarantee
    rule: A recall never downloads a missing embedding model; it answers with keyword results.
    tests:
      - >-
        packages/core/test/recall-model-missing-1587.test.ts::keyword results at once, with the reason and the next
        step; no process spawned, no download
    promises:
      - REC-3
  packages/core/src/engrams.ts#EngramStoreUnreadableError:
    kind: guarantee
    rule: A store file that exists but cannot be read as engrams is refused, never treated as an empty store.
    tests:
      - packages/core/test/unreadable-store-guard.test.ts::a truncated file throws rather than reading as empty
      - packages/core/test/unreadable-store-guard.test.ts::the engrams SURVIVE a write attempt against a corrupted store
    promises:
      - DUR-3
  packages/core/src/engrams.ts#HeldFile:
    kind: note
    why: Type documentation for records held back from a commit; no rule of its own.
  packages/core/src/engrams.ts#HeldRecoveryUnreadableError:
    kind: note
    why: Names an error type; 'cannot be read' describes when it is thrown.
  packages/core/src/engrams.ts#PendingRename:
    kind: guarantee
    rule: >-
      Loading a store never writes history; an id rename found at load is recorded by the next write that puts the new
      id on disk.
    tests:
      - >-
        packages/core/test/formal-audit-persist-renames.test.ts::a read-only load writes no history, however often it
        runs
      - >-
        packages/core/test/formal-audit-persist-renames.test.ts::the rename is recorded once, by the write that puts the
        new id on disk
  packages/core/src/engrams.ts#SYNC_HELD_RENAME_REASON:
    kind: note
    why: A history reason label; 'never-pushed' describes the record, not a rule.
  packages/core/src/engrams.ts#assertShrinkAllowed:
    kind: guarantee
    rule: >-
      A whole-store write that would drop more than the tolerated share of the memories on disk is refused unless the
      caller declared it.
    lean:
      - PlurSpec/R2Persist.lean:fixed_fail_closed
      - PlurSpec/R2Persist.lean:base_bounds
    tests:
      - packages/core/test/store-corruption-guard.test.ts::refuses a write that would drop the corpus past the tolerance
      - >-
        evals/durability/test_promise_DUR4_wiping_save_refused.test.ts::one save that would keep 2 of 20 memories is
        refused and the store is untouched
    promises:
      - DUR-4
  packages/core/src/engrams.ts#countEngramsOnDisk:
    kind: guarantee
    rule: >-
      An existing store file whose records cannot be counted exactly makes the write fail, never lets it replace the
      store.
    lean:
      - PlurSpec/R2Persist.lean:fixed_fail_closed
    tests:
      - packages/core/test/formal-r2-persist-shrink.test.ts::refuses to overwrite a merge-conflicted store
      - packages/core/test/formal-r2-persist-shrink.test.ts::refuses to overwrite a zero-byte store
  packages/core/src/engrams.ts#countRecordStarts:
    kind: guarantee
    rule: Counting records on disk is exact, including entries with multi-line text.
    tests:
      - >-
        packages/core/test/store-corruption-guard.test.ts::counts records exactly without parsing, including multi-line
        scalars
  packages/core/src/engrams.ts#engramIdDatePrefix:
    kind: guarantee
    rule: New local ids are always minted in the full-date form; the legacy compact form is read but never minted.
    tests:
      - packages/core/test/engrams.test.ts::mints canonical full-date IDs (ENG-YYYY-MM-DD-NNN)
  packages/core/src/engrams.ts#engramStoreEntries:
    kind: guarantee
    rule: A store whose engrams key has no value is refused as unreadable, not loaded as empty.
