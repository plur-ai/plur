      Merged, closing #939 — plur ui --host serving the whole store
      unauthenticated to a request carrying Host: localhost.

  # ─── SHOULD — the live safety defect ────────────────────────────────────
  - id: B6
    ref: github:plur-ai/plur#1082
    title: Pinned two-tier model — hard cap plus priority eviction
    owner_role: engineering
    default_claimer: miles-on-nightshift
    state: todo
    priority: should
    effort_estimate: M
    roadmap: R-041
    blocker: CHANGES_REQUESTED
    labels: [injection, defect, p1]
    acceptance: |
      Merged. Today 48 pinned engrams cost 27,706 tokens against a 4,000-token
      sub-budget: about ten fit and thirty-eight are silently dropped from
