name: Published 0.21.4 Windows and WSL verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-2025
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        scenario: [fresh, from-0.19.4, from-0.21.2]
    env:
      PLUR_CI_VERSION: 0.21.4
      PLUR_EDITORS_REQUIRED: codex
      PLUR_TEST_CODEX_HOST: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.13.0
      - name: Install public packages exactly as a user does
        shell: pwsh
        run: |
          npm install -g --no-audit --no-fund @plur-ai/mcp @plur-ai/cli @openai/codex
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node --version
          npm --version
          codex --version
          plur --version
      - name: Public upgrade, registrations, and hook behavior
        shell: pwsh
        run: node scripts/public-editors-probe.mjs --scenario ${{ matrix.scenario }}
      - name: Public MCP roundtrip and stale-pin audit
        if: always()
        shell: pwsh
        run: node --experimental-transform-types scripts/public-memory-probe.mjs
  wsl:
    runs-on: windows-2025
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: fresh
            filesystem: linux
          - scenario: from-0.19.4
            filesystem: linux
          - scenario: from-0.19.4
            filesystem: mounted
    steps:
      - name: Preserve Unix line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          additional-packages: curl ca-certificates xz-utils git bubblewrap
          use-cache: false
      - name: Confirm real WSL2
        shell: pwsh
        run: wsl --list --verbose
      - name: Install Linux Node and public packages
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          uname -a
          mkdir -p /opt/plur-node
          cd /opt/plur-node
          curl -fsSLO https://nodejs.org/dist/v24.13.0/node-v24.13.0-linux-x64.tar.xz
          curl -fsSLO https://nodejs.org/dist/v24.13.0/SHASUMS256.txt
          grep ' node-v24.13.0-linux-x64.tar.xz$' SHASUMS256.txt | sha256sum -c -
          tar -xJf node-v24.13.0-linux-x64.tar.xz --strip-components=1
          export PATH=/opt/plur-node/bin:/usr/local/bin:/usr/bin:/bin
          export PLUR_TEST_CODEX_HOST=1
          npm install -g --no-audit --no-fund @plur-ai/mcp @plur-ai/cli @openai/codex
          node --version
          npm --version
          codex --version
          plur --version
      - name: Public upgrade and hooks in WSL2
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          export PATH=/opt/plur-node/bin:/usr/local/bin:/usr/bin:/bin
          export PLUR_TEST_CODEX_HOST=1
          export PLUR_CI_VERSION=0.21.4 PLUR_EDITORS_REQUIRED=codex
          if [ '${{ matrix.filesystem }}' = mounted ]; then
            mkdir -p "$PWD/mounted-test-temp"
            export TMPDIR="$PWD/mounted-test-temp"
          fi
          node scripts/public-editors-probe.mjs --scenario '${{ matrix.scenario }}'
      - name: MCP roundtrip and stale-pin audit in WSL2
        if: always()
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          export PATH=/opt/plur-node/bin:/usr/local/bin:/usr/bin:/bin
          export PLUR_TEST_CODEX_HOST=1
          if [ '${{ matrix.filesystem }}' = mounted ]; then
            export TMPDIR="$PWD/mounted-test-temp"
          fi
          node --experimental-transform-types scripts/public-memory-probe.mjs
