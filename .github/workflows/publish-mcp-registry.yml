name: Publish to MCP Registry

# Publishes server.json to the official MCP Registry (registry.modelcontextprotocol.io)
# on every GitHub Release. Auth is GitHub OIDC — no secrets, no local install needed.
# The registry listing propagates to directories that ingest it (PulseMCP, mcp.so, …).

# Triggered explicitly by scripts/release.sh (`gh workflow run` on the release tag)
# — the single deterministic path. The old `release: published` trigger was removed
# because that event is suppressed when a release is created by a GITHUB_TOKEN actor
# (GitHub's recursion guard), which silently skipped the registry publish for v0.14.0.
# To publish a tag by hand: gh workflow run "Publish to MCP Registry" --ref vX.Y.Z
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # required for GitHub OIDC auth to the registry
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Sync server.json version to the release tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 - "$VERSION" <<'PY'
          import json, re, sys
          raw = sys.argv[1] if len(sys.argv) > 1 else ""
          d = json.load(open("server.json"))
          v = raw if re.match(r"^\d+\.\d+\.\d+", raw or "") else d["version"]
          d["version"] = v
          for p in d.get("packages", []):
              p["version"] = v
          json.dump(d, open("server.json", "w"), indent=2)
          print("server.json version ->", v)
          PY

      - name: Install mcp-publisher
        run: |
          # Immutable release and digest, verified from the upstream release.
          curl --fail --show-error --silent --location --proto '=https' --max-time 60 \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz \
            --output mcp-publisher.tar.gz
          echo 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz' > mcp-publisher.sha256
          sha256sum --check --strict mcp-publisher.sha256
          tar xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher

      - name: Login (GitHub OIDC) and publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
