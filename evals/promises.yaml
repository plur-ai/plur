# What PLUR promises — one plain sentence each, grouped by what the product does.
#
# This file is the spec; the evals under evals/<capability>/ are its proof. How to
# read and change it: evals/README.md. In short:
#   * a promise is green only when it has at least one eval and every eval behind
#     it passes; a promise with no eval is "no-eval", never a pass;
#   * every eval is shown to bite: evals/mutants/<ID>-<n>.patch plants a bug that
#     must turn it red (checked nightly);
#   * `today` records what is true now (holds | broken | unknown), with evidence;
#   * `decide` marks a promise whose wording is a product decision still open.
# Ids are stable once used: a promise that changes meaning gets a new id.
# Changing a promise or an eval needs the approval of a code owner (.github/CODEOWNERS).

capabilities:

- key: recall
  name: Finding memories
  what_it_does: When I or my agent ask about something, PLUR finds the memories that answer it, by meaning as well as by words.
  promises:
  - id: REC-1
    promise: When I ask about something I taught it, the memory that answers it comes back in the top five.
    kind: quality
    today: broken
    evidence: "Measured 2026-10-15 (real model, labelled set written by another model family): 52/80 = 65% in the top five on the dev set (95% CI 54-75%), 64/80 = 80% on the private holdout. Every lexical question is found; the misses are reworded questions (see REC-2). Floor 85% (owner, 2026-10-16)."

  - id: REC-2
    promise: A memory worded differently from my question is still found; matching words is not required.
    kind: quality
    today: broken
    evidence: "Measured 2026-10-15 on questions that share no content word with their memory: 12/40 = 30% in the top five on the dev set (95% CI 18-45%), 24/40 = 60% on the private holdout. Keyword search alone finds 1/40, so the meaning model does contribute. Floor 60% (owner, 2026-10-16)."

  - id: REC-3
    promise: If the meaning model cannot load, I still get keyword results straight away, and the answer says the search was degraded.
    kind: deterministic
    today: holds
    evidence: recall-model-missing-1587.test.ts, formal-r2-corea-inject-degraded.test.ts.
  - id: REC-4
    promise: A memory I forgot never comes back when I search, whichever search I use.
    kind: deterministic
    today: holds
    evidence: evals/recall REC-4 covers keyword and hybrid search after forget, with embeddings off and with the word-count stand-in embedder; planted bug caught. plur.test.ts covers keyword recall only.
  - id: REC-5
    promise: Search never returns more results than I asked for, and an empty store answers with nothing rather than an error.
    kind: deterministic
    today: holds
    evidence: hybrid-search.test.ts limit and empty-store cases (the limit case also passes on zero results).
  - id: REC-6
    promise: A memory that was replaced by a correction is either hidden or visibly marked as replaced when I search, in what I actually see.
    kind: deterministic
    today: holds
    evidence: 'Eval 2026-10-17: core recall/recallHybrid return the replaced memory with its superseded_by link, and the MCP replies (plur_recall hybrid and keyword, plur_recall_hybrid) show it with a visible ''[superseded by <correction id>]'' in the statement the agent reads. Marked, not hidden. 3 planted bugs caught (link not written; mark dropped from the hybrid reply; mark dropped from the keyword reply).'
  - id: REC-7
    promise: With a slow but working meaning model, search still answers within the normal deadline and says when the meaning part was cut short.
    kind: deterministic
    today: holds
    evidence: 'evals/recall REC-7: with PLUR_RECALL_DEADLINE_MS unset and a stub model that answers correctly after 25 s, hybrid search returns the keyword match within 10 s + 5 s margin, with mode not ''hybrid'', degraded_reason ''semantic_deadline'', a plain embedderError and results_complete false. Control: the same store with a fast model gives mode ''hybrid'', complete results. 3 planted bugs killed (REC-7-1..3).'
  - id: REC-8
    promise: When the memory store can search by meaning and by keyword itself, hybrid recall uses those searches and does not load every memory; stores that cannot keep working as before.
    kind: deterministic
    today: broken
    evidence: 'Eval written red 2026-10-28 for #1787 (target 0.23.0), before the code. evals/recall REC-8: a store with role ''primary'' offering searchVector (meaning) and searchBM25 (keyword), the StorageAdapter names #1787 uses. Today recallHybridWithMeta asks neither (0 calls each), reads the whole store once through loadFiltered() in _hybridCandidates/_filterEngrams and ranks in memory with hybridSearchWithMeta, so the store''s meaning-only hit ranks 5th instead of top two; only the PGLite index takes the database path (_pgliteHybridRecall). load(), loadCached() and loadFiltered() all count as loading every memory; loadByIds (reactivation) does not. Control (a store without the searches) is green. Mutants wait for the implementation: there is no code path yet to plant a bug in.'
    decide: 'Decided 2026-10-28 (owner): a read limited to one scope (loadFiltered without an id list) still counts as loading every memory; that read is the cost #1787 removes.'


- key: learn
  name: Saving memories
  what_it_does: When I or my agent teach PLUR something, it keeps it once, warns about near-copies, and never silently drops what I said.
  promises:
  - id: LRN-1
    promise: Saying exactly the same thing twice keeps one memory, not two.
    kind: deterministic
    today: holds
    evidence: formal-r2-apply-core-always-store.test.ts, formal-r2-corea-refcount.test.ts.
  - id: LRN-2
    promise: Saying something new that merely resembles an existing memory saves it, and I am told which memory it resembles.
    kind: deterministic
    today: holds
    evidence: dedup-cosine.test.ts ("never suppresses a write").

  - id: LRN-4
    promise: After I forget a memory, saying the same thing again gives me a fresh memory instead of bringing the old one back.
    kind: deterministic
    today: holds
    evidence: "Eval 2026-10-15, same scope, through learn and learnAsync."

  - id: LRN-5
    promise: Importing many memories at once catches duplicates inside the batch and still saves every item when the AI-check budget runs out.
    kind: deterministic
    today: holds
    evidence: batch.test.ts, learn-batch-cap.test.ts.
  - id: LRN-6
    promise: A memory I locked is never rewritten by an automatic merge or update.
    kind: deterministic
    today: holds
    evidence: 'Eval 2026-10-17: locked before the save, and locked by a second writer between the dedup read and the write (audit C-01), for UPDATE and MERGE. Planted bugs LRN-6-1/2 (both checks) and LRN-6-3 (only the under-lock recheck) are killed. Also formal-persistence-learn-async.test.ts; Lean theorem fixed_never_writes_locked.'
  - id: LRN-7
    promise: With an AI checker configured, a real duplicate leaves one memory that my agent is still given; a statement that changes a value is saved as its own memory that supersedes the old one (the old text unchanged, marked superseded, no longer given to the agent), unless the old one is locked (then LRN-9); a different-but-similar statement on another subject stays its own memory, still given. On the labelled test pairs, at most 10% of each kind of pair is handled wrongly.
    kind: agent
    today: unknown
    evidence: 'Eval written 2026-10-17 (replaces LRN-3, audit D-01); reworded 2026-10-18 after the owner decided a changed value is "a separate memory that supersedes the previous one". Configuration: learnAsync with an LLM checker (Claude via the claude CLI on the agent-eval auth path, PLUR''s own dedup prompt), real embedder for candidates. Grades what is stored after each save over the three-label pairs evals/gold/dedup-v2 (dev; the private holdout''s dedup-v2 when configured, pinned by evals/gold/holdout-dedup-v2.sha256): missed-duplicate, failed-supersede and false-merge rates. Rewriting the existing text is wrong under every label. Classification proven on hand-built snapshots and a scripted checker (evals/helpers/dedup-outcome.unit.test.ts). Ceilings 10% for each rate (owner, 2026-10-18). These are observed ceilings on a fixed benchmark, not a bound on the true error rate: per set, at most 3 of 30 missed duplicates, 2 of 27 failed supersedes and 2 of 20 false merges pass; the 95% interval for 2 of 20 is about 3% to 30% (fourth audit). "Still given" means live: status active and not superseded. The false-merge rate counts only with at least 20 distinct pairs in the set. Each set has 20 since 2026-10-18: the 3 relabelled plus 17 per set written by a labeller from another model family (dedup-v2/LABELLER-CHECKLIST.md), 77 pairs in all. Not yet run under the new labels (paid). The earlier two-label dev run (0/30 missed duplicates, 25/30 false merges) counted the changed-value pairs as false merges; under the new labels most of those are supersede pairs.'
    decide: 'On which checker model are the ceilings measured? The MCP server ships gpt-4o-mini via OPENAI/OPENROUTER keys; the eval uses Claude. Suggested: the model the server ships. (Ceilings decided 2026-10-18: 10% each. A locked target decided 2026-10-18: it goes to the review queue, LRN-9.)'
  - id: LRN-8
    promise: When the duplicate check says a new statement updates an existing memory that is not locked, the new statement is saved as its own memory that supersedes the old one, through a single save and a batch save; the old text is kept and is no longer given to the agent. (A locked memory goes to review instead, LRN-9.)
    kind: deterministic
    today: broken
    evidence: 'Eval 2026-10-18 (owner decision: a changed value is a separate memory that supersedes the previous one). Scripted checker answers UPDATE on three dev supersede pairs, through learnAsync and learnBatch; graded from disk by helpers/dedup-outcome.ts; a distinct control pair with ADD must stay two live memories with no link; then injection must give the new memory and not the old. Broken on the judge branch: every UPDATE rewrites the existing text (''1 stored, 1 live; the existing memory''s text was changed''), single and batch.'
  - id: LRN-9
    promise: When the duplicate check says a new statement updates a memory I locked, the locked memory stays unchanged and is the one given to my agent; the new statement waits unseen in my review queue until I decide, through a single save and a batch save.
    kind: deterministic
    today: broken
    evidence: 'Eval 2026-10-18 (owner decision: "there should be a review queue unless the user specifies differently"). The review queue is the tension records PLUR already shows for memories that disagree (listTensions, plur_tensions; my decision through confirm, dismiss or resolve, COR-5). Scripted checker answers UPDATE onto a locked memory, through learnAsync and learnBatch; graded from disk. Broken on the judge branch: the locked memory stays unchanged, active and given to the agent, and the new statement is saved, but no review item is created (review queue: []), single and batch.'
    decide: 'Decided 2026-10-19: while the review waits only the locked memory is given (decision board B1); no setting to skip the review (B2).'

- key: corrections
  name: Corrections and contradictions
  what_it_does: When I correct something, the correction wins; when two memories contradict, PLUR shows me and lets me choose.
  promises:
  - id: COR-1
    promise: After I save a correction, my agent is given the correction and no longer the memory it replaces.
    kind: deterministic
    today: holds
    evidence: supersedes-inject.test.ts.
  - id: COR-2
    promise: If the correction itself cannot be delivered (a draft, expired, or not available here), the old memory is still given rather than nothing.
    kind: deterministic
    today: broken
    evidence: 'Eval 2026-10-17: holds for a draft, expired or not-yet-valid correction, and for one outside a scopes allow-list. Broken for a correction in another project with ordinary scope selection (global original, correction in project:other, inject in project:mine): ''the agent was given neither the correction nor the old memory (…); it got []'', for inject and injectHybrid, although before the correction existed the same injection gave the old memory (inject.ts ~906-924, issue 1237).'

  - id: COR-3
    promise: A correction and the memory it replaces are linked both ways, and the link survives a restart.
    kind: deterministic
    today: holds
    evidence: supersedes.test.ts, provenance-supersession.test.ts.
  - id: COR-4
    promise: A correction and the memory it replaces are never reported to me as a contradiction.
    kind: deterministic
    today: holds
    evidence: supersedes.test.ts.
  - id: COR-5
    promise: When I resolve a contradiction, the memory I picked stays and the other is retired, even if two people resolve it at the same time.
    kind: deterministic
    today: holds
    evidence: tension-lifecycle.test.ts.

- key: forget
  name: Forgetting
  what_it_does: When I tell PLUR to forget something, it is gone from everything my agent sees, and the forget is recorded.
  promises:
  - id: FGT-1
    promise: A memory I forget no longer reaches my agent, in search or at session start.
    kind: deterministic
    today: holds
    evidence: history-integration.test.ts, concurrency-write-path.test.ts.
  - id: FGT-2
    promise: One explicit forget removes a memory even if it was saved several times.
    kind: deterministic
    today: holds
    evidence: 'Eval 2026-10-17: a memory saved 3 times is gone after one plur_forget (MCP tool) and after one `plur forget <id>` (CLI), the eval passing no force flag itself; recall and inject no longer return it. A plain core forget(id) without force only lowers the count. 3 planted bugs caught (core ignores force; plur_forget drops force; CLI drops force).'

  - id: FGT-3
    promise: When what I asked to forget matches more than one memory, PLUR refuses and asks, instead of forgetting the wrong one.
    kind: deterministic
    today: holds
    evidence: forget-namespaced-walk-order.test.ts.

- key: inject
  name: What my agent is given
  what_it_does: At the start of a session and on each task, PLUR gives my agent the memories that matter for it, within the space I allow.
  promises:
  - id: INJ-1
    promise: My agent gets the memories needed for its task without being given nearby rules that do not apply.
    kind: quality
    today: broken
    measured: "On 30 labelled tasks (evals/gold): every needed memory given in at least 70% of tasks, and a nearby not-applicable memory given in at most 50% (floors set by the owner 2026-10-16; a not-applicable neighbour is a failure, owner 2026-10-17)."
    evidence: "Measured 2026-10-15 on 30 labelled tasks: every needed memory was given for 29/30 (dev) and 29/30 (holdout), but about 24 of 150 memories are given per task, and the nearby not-applicable memory was given too in 24/30 (dev) and 27/30 (holdout). Coverage holds; leaving out what does not apply does not."

  - id: INJ-2
    promise: What my agent is given never goes over the space I set for it.
    kind: deterministic
    today: holds
    evidence: plur.test.ts budget case (two small memories, so a doubled budget would still pass); formal-apply-budget-inject.test.ts at unit level.
  - id: INJ-4
    promise: A memory waiting for my approval is never given to my agent, but I can still find it by searching.
    kind: deterministic
    today: holds
    evidence: "Eval 2026-10-15, end to end through inject and injectHybrid; recall and recallHybrid still find the draft."

  - id: INJ-5
    promise: Memories I rated helpful are given to my agent ahead of equally relevant ones I rated unhelpful.
    kind: deterministic
    today: holds
    evidence: "Eval 2026-10-15 with 1 and 3 ratings each. With one rating, a helpful rating can LOWER a new memory's score: it promotes the memory out of 'leaning' and so removes the recently-learned bonus (fresh-tail.ts). Worth a product look."
  - id: INJ-6
    promise: Pinned memories are given first, up to their share of the space I set (half by default), so the memories matching my task still get room; PLUR names any pinned memory it could not fit.
    kind: deterministic
    today: broken
    evidence: 'Eval 2026-10-17 (evals/inject INJ-6, replaces INJ-3; INJ-3 cases kept and green). Ten pinned rules under a 150-token budget: the agent stays within budget and every pinned rule left out is named (core omitted_pinned and both MCP inject replies). Fails ''before anything else'': ''pinned rules were left out (8 of 10 …) while 1 unpinned memories were given, taking space in the same budget''. Pins are capped at half the budget (PINNED_TOKEN_BUDGET_RATIO 0.5, inject.ts), so unpinned memories get the other half while pins are dropped.'
    decide: 'Decided 2026-10-19 (decision board A2): keep the pinned share, so task-relevant memories always get room.'
  - id: INJ-7
    promise: A memory reported as given to my agent is in the actual tool or hook reply, with its text and where it came from.
    kind: deterministic
    today: broken
    evidence: 'Eval 2026-10-18 (evals/inject INJ-7; extended after re-audit B-01). Surfaces: MCP plur_inject, plur_inject_hybrid and plur_session_start over the in-memory transport, and the installed hook-inject run from source. Cases: a pinned ''Never …'' rule, and a memory over 60 characters routed to ''also consider''. Fails on every surface: the MCP inject replies omit the constraints section (''reported as given, but the reply has no entry for it at all'', tools.ts:2186, :2233); the also-consider entry is cut to 60 characters (''…a cutover is the moment billing ser'', inject.ts:1320 formatLayer1); and no entry names its scope (''does not say where it came from'', formatLayer1/2/3).'
    decide: What must a delivered entry show as 'where it came from'? The eval requires the memory's scope on its entry; a pack name or store label would need the eval widened. No reply shows either today.


- key: feedback
  name: Ratings and fading
  what_it_does: My ratings teach PLUR what helps; memories I never use fade gently; dated memories appear only while they are valid.
  promises:
  - id: FDB-1
    promise: Rating a memory helpful raises it by a fixed small step and rating it unhelpful lowers it by a larger one, never past the limits.
    kind: deterministic
    today: holds
    evidence: feedback.test.ts (expected values are taken from the exported constants, so changing them cannot fail it).
  - id: FDB-2
    promise: A rating never approves a draft, and an automatic rating never makes a memory more settled.
    kind: deterministic
    today: holds
    evidence: feedback.test.ts, draft-approval-gate.test.ts, feedback-auto-source.test.ts.
  - id: FDB-3
    promise: A memory I do not use fades by half over a stated period and never fades away completely.
    kind: deterministic
    today: holds
    evidence: "Eval 2026-10-15 pins a half-life of 14 days (measured about 13.9) with a floor above zero."

  - id: FDB-4
    promise: A memory I locked does not fade.
    kind: deterministic
    today: broken
    evidence: "Eval 2026-10-15 red: after 60 days unused a locked memory ranks behind a fresh, weaker one. Confidence decay exempts locked memories (decay.ts) but recency decay in injection does not (inject.ts ~603)."

  - id: FDB-5
    promise: A memory outside its valid dates is hidden from search, listing and my agent, and an unreadable date never hides a memory.
    kind: deterministic
    today: holds
    evidence: validity-instants.test.ts, formal-scopeinject-decay.test.ts.

- key: privacy
  name: Privacy and scopes
  what_it_does: Every memory belongs to a scope that decides who sees it and where it is stored; private memories stay on my machine.
  promises:
  - id: PRV-1
    promise: A memory I mark private is never sent to a team server, whichever way it is saved.
    kind: deterministic
    today: holds
    evidence: formal-writepath-private.test.ts; Lean theorem explicit_private_stays_local.
  - id: PRV-2
    promise: Searching in one project never shows memories from another project, even one with a similar name.
    kind: deterministic
    today: holds
    evidence: scope-routing.test.ts, read-side-scope-visibility.test.ts.
  - id: PRV-3
    promise: My agent is never given a memory from a scope it is not allowed to see.
    kind: deterministic
    today: holds
    evidence: formal-scopeinject-visibility.test.ts; Lean theorem selected_visible.
  - id: PRV-4
    promise: When PLUR picks a scope for an unscoped memory, it never files it into a shared team scope on its own.
    kind: deterministic
    today: holds
    evidence: route-unscoped.test.ts; Lean theorem autoRoute_leaving_is_scanned.
  - id: PRV-6
    promise: A memory saved to a team scope is shared with the team unless I mark it private, and the save tells me where it went.
    kind: deterministic
    today: holds
    evidence: 'Eval 2026-10-17 (replaces PRV-5, owner board 2026-10-17): with a stub team server, a team-scope save with no visibility reaches the server once through learn(), learnRouted() and MCP plur_learn; the answer says delivery remote (learn() returns before the send and says remote or queued for the team scope) and names the team scope. visibility private stays in the local store, nothing is sent, and the answer says delivery local with ''this machine'' in words. Mutants PRV-6-1..3 killed.'
  - id: PRV-7
    promise: Moving a memory to another scope keeps a usable copy and its history, and a preview or a failed move changes nothing.
    kind: deterministic
    today: holds
    evidence: 'Eval 2026-10-17: rescope (packages/core rescope, MCP plur_rescope tools.ts ~4619, plur rescope cli/src/index.ts ~68). Local move keeps text, findable in the new scope, history keeps created + rescoped. Team move leaves exactly one copy on the team server, the retired original links to it, history records it. Dry run (engine, MCP, CLI) changes no file and sends nothing. Team server down and a secret-bearing memory: status error, file and history unchanged. Server-assigned id equal to another local memory''s id: that memory untouched. Mutants PRV-7-1..4 killed.'

- key: folders
