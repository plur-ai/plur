    why: >
      The provenance epic, +12,804 across 88 files. It is the trunk of M3 and
      belongs to v0.21.0, not to a four-day ramp.
  - id: "#981 / #1017 / #1108"
    why: 1,624 / 767 / 1,226 lines, all CHANGES_REQUESTED. W37 and v0.20.0+.
