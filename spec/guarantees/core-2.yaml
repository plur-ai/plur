  packages/core/src/receipt.ts#snippet:
    kind: guarantee
    rule: The reported maximum reuse is always at least the count of any live entry in the most-reused list.
    tests:
      - packages/core/test/receipt.test.ts::reuse.max never contradicts a larger entry in reuse.top (both live-only)
  packages/core/src/remote-only.ts#(module):
    kind: guarantee
    rule: In a remote-only folder, any write that would stay on this machine is refused with nothing written or sent.
    tests:
      - >-
        packages/core/test/folder-remote-only.test.ts::personal and local-only scopes are refused, naming the folder and
        how to change it; nothing is written or sent
  packages/core/src/remote-only.ts#RemoteOnlyBinding:
    kind: guarantee
    rule: When the folder map cannot be read, the instance reads and writes nothing and never falls back to memory being on.
    tests:
      - >-
        packages/core/test/folder-remote-only-guard.test.ts::S-1: an unreadable folders.yaml refuses even an explicit
        team-scope save
      - packages/core/test/folder-remote-only-guard.test.ts::a bound instance reads and writes nothing
    promises:
      - OFF-3
  packages/core/src/remote-only.ts#name:
    kind: guarantee
    rule: Folder and scope names in a refusal are printed escaped, so they can never act as instructions or commands.
    tests:
      - >-
        packages/core/test/folder-remote-only-review.test.ts::no raw line break, bidi control or shell syntax, and no
        command for that folder
  packages/core/src/remote-recall.ts#(module):
    kind: guarantee
    rule: >-
      Remote memories are never cached on disk, and when a team server cannot be reached recall answers from local
      memory and says it was degraded.
    tests:
      - packages/core/test/remote-recall.test.ts::host down → local results still served, degradation recorded
    promises:
      - TEAM-1
      - TEAM-2
  packages/core/src/remote-recall.ts#BudgetExpiry:
    kind: guarantee
    rule: A timeout caused by this process's own blocked event loop is not counted against the server's breaker.
    tests:
      - >-
        packages/core/test/recall-deadline-1586-audit.test.ts::after CLIENT_SLOW_STREAK_LIMIT in a row, further ones
        count as host timeouts and open the breaker
  packages/core/src/remote-recall.ts#CLIENT_SLOW_STREAK_LIMIT:
    kind: guarantee
    rule: >-
      After a fixed number of slow-client timeouts in a row, further ones count against the server, and any answer from
      the server resets the run.
    tests:
      - >-
        packages/core/test/recall-deadline-1586-audit.test.ts::after CLIENT_SLOW_STREAK_LIMIT in a row, further ones
        count as host timeouts and open the breaker
      - packages/core/test/recall-deadline-1586-audit.test.ts::an answer from the host resets the streak
  packages/core/src/remote-recall.ts#HOOK_HEADER_REPEAT_MS:
    kind: guarantee
    rule: The same server state is printed into a prompt header again at most once per repeat window.
    tests:
      - >-
        packages/core/test/remote-recall.test.ts::prints on first sight, suppresses the same state, prints again on
        state change
      - packages/core/test/remote-recall.test.ts::re-prints the same state after the 4h window
  packages/core/src/remote-recall.ts#HostRecallOutcome:
    kind: guarantee
    rule: A recall outcome's diagnostic detail is bounded text chosen by PLUR, never free text from the server.
    none: no test checks that server text cannot reach the outcome detail
  packages/core/src/remote-recall.ts#MAX_STARVATION_CREDIT_MS:
    kind: guarantee
    rule: Extra time credited for a blocked event loop is capped, so a starved request still ends.
    tests:
      - >-
        packages/core/test/remote-recall.test.ts::honors the absolute credit ceiling — a starved process still
        terminates
  packages/core/src/remote-recall.ts#PRINT_FIELDS:
    kind: guarantee
    rule: A recall never overwrites the record of which degradation header was last printed.
    tests:
      - packages/core/test/remote-recall.test.ts::a remoteRecall persist does not erase a concurrent hook-header claim
  packages/core/src/remote-recall.ts#PROBE_CLEARABLE_STATES:
    kind: guarantee
    rule: >-
      A successful identity probe clears only network failures, never an unsupported, rate-limited or authorization
      state.
    tests:
      - packages/core/test/remote-recall.test.ts::a successful /me probe clears a cached network-class failure
      - packages/core/test/remote-recall.test.ts::a successful probe does NOT clear an endpoint-support failure
  packages/core/src/remote-recall.ts#RATE_LIMIT_MAX_COOLDOWN_MS:
    kind: guarantee
    rule: A server's Retry-After is honoured for at most one hour.
    none: no test sends an oversized Retry-After
  packages/core/src/remote-recall.ts#RECALL_BOOKKEEPING_LOCK_WAIT_MS:
    kind: guarantee
    rule: A recall does not wait behind a writer for its usage bookkeeping; past a short wait it skips the bookkeeping.
    none: no test holds the store lock during a recall and checks the bookkeeping is skipped
  packages/core/src/remote-recall.ts#RemoteStoreStatusEntry:
    kind: note
    why: Instructs renderers not to present an old observation as the server's current state.
  packages/core/src/remote-recall.ts#TokenHealth:
    kind: guarantee
    rule: >-
      Each token's health is tracked on its own, so one token's events never reset or rate-limit another, and the token
      itself is never the key.
    lean:
      - PlurSpec/R2CoreB.lean:noninterference
      - PlurSpec/R2CoreB.lean:other_tokens_irrelevant
    tests:
      - >-
        packages/core/test/formal-r2-coreb-health.test.ts::a healthy token interleaved with a revoked one does not reset
        the revoked token
      - packages/core/test/formal-r2-coreb-health.test.ts::never persists a token in the health file
  packages/core/src/remote-recall.ts#UNSUPPORTED_TTL_MS:
    kind: guarantee
    rule: A 404 marks a server unsupported for a bounded time, not for the life of the process.
    tests:
      - packages/core/test/remote-recall.test.ts::404 → unsupported for a TTL, not process lifetime
  packages/core/src/remote-recall.ts#cancelOverall:
    kind: note
    why: Explains why the request timer accounts for event-loop starvation.
  packages/core/src/remote-recall.ts#claim:
    kind: guarantee
    rule: When a server recovers, the printed marker is reset so the next degradation prints again.
    tests:
      - packages/core/test/remote-recall.test.ts::recovery to ok resets the marker so a recurrence prints again
  packages/core/src/remote-recall.ts#claimHalfOpenTrial:
    kind: guarantee
    rule: Only one process dials a server's trial request after a cooldown, and if the lock cannot be taken none does.
    tests:
      - >-
        packages/core/test/recall-deadline-1586-audit.test.ts::the loser does not erase half_open_trial_at, and a third
        process does not dial a second trial
      - >-
        packages/core/test/recall-deadline-1586-audit.test.ts::with the health-file lock held by a live process, a due
        trial is not dialed
  packages/core/src/remote-recall.ts#claimHookDegradationLines:
    kind: guarantee
    rule: >-
      Degradation headers print on a state change and then at most once per window; cooldown and unsupported states
      never print.
    tests:
      - >-
        packages/core/test/remote-recall.test.ts::prints on first sight, suppresses the same state, prints again on
        state change
      - packages/core/test/remote-recall.test.ts::skipped_cooldown and unsupported never print
  packages/core/src/remote-recall.ts#dialHost:
    kind: guarantee
    rule: A single 403 is never read as a revoked token; it takes two in a row.
    tests:
      - packages/core/test/remote-recall.test.ts::403 requires 2 CONSECUTIVE before reading as revocation (forbidden)
  packages/core/src/remote-recall.ts#hookRemoteHeaderLine:
    kind: guarantee
    rule: Cooldown and unsupported states never print a line into a prompt header.
    tests:
      - packages/core/test/remote-recall.test.ts::skipped_cooldown and unsupported never print
  packages/core/src/remote-recall.ts#isHostInCooldown:
    kind: guarantee
    rule: Unreadable server health state never blocks a write.
    tests:
      - >-
        packages/core/test/outbox-circuit-breaker.test.ts::never throws on unreadable health state — it is an
        optimisation, not a gate
  packages/core/src/remote-recall.ts#persistHostChanges:
    kind: guarantee
    rule: >-
      Saving server health writes only the fields this call changed, against the current file under the lock, so
      concurrent updates are not lost.
    tests:
      - packages/core/test/remote-recall.test.ts::a writer with a stale entry snapshot does not erase another writer
      - "packages/core/test/recall-deadline-1586-audit.test.ts::a dial writes only the fields it changed: another token"
  packages/core/src/remote-recall.ts#printKey:
    kind: guarantee
    rule: A plain healthy answer never prints a header; a healthy answer that narrowed scopes prints once like a state.
    tests:
      - packages/core/test/remote-recall.test.ts::ok with dropped_scopes prints the scope-narrowing line once
  packages/core/src/remote-recall.ts#processHostRows:
    kind: guarantee
    rule: A server row without tags cannot make scoring throw.
    none: no test sends a remote row without tags
  packages/core/src/remote-recall.ts#readApplyWrite:
    kind: guarantee
    rule: A server's health record time never moves backwards.
    none: no test checks the record time under concurrent updates
  packages/core/src/remote-recall.ts#recordWriteOutcome:
    kind: guarantee
    rule: Write failures open the same per-server breaker that recall uses, and a write success clears it.
    tests:
      - packages/core/test/outbox-circuit-breaker.test.ts::opens the breaker after the threshold of write failures
      - >-
        packages/core/test/outbox-circuit-breaker.test.ts::a write SUCCESS clears the count, so both legs see a
        recovered host
  packages/core/src/remote-recall.ts#remoteRecall:
    kind: guarantee
    rule: Remote recall never throws and never runs past its budget or deadline.
    tests:
      - packages/core/test/remote-recall.test.ts::slow server → timeout within the budget
      - >-
        packages/core/test/recall-deadline-1586-audit.test.ts::a never-answering server: returns within the deadline,
        remote.state timeout, results_complete false
    promises:
      - TEAM-1
  packages/core/src/remote-recall.ts#settleBy:
    kind: guarantee
    rule: Waiting for a deadline never rejects; a failure comes back as a result.
    none: no test checks settleBy directly
  packages/core/src/remote-recall.ts#stampStoreRow:
    kind: guarantee
    rule: >-
      Loader markers on a remote row are set by the loader; any the row ships itself are dropped, so a server row cannot
      pose as another origin.
    lean:
      - PlurSpec/R2CoreB.lean:remote_origin_is_store
    tests:
      - >-
        packages/core/test/formal-r2-coreb-ingestion.test.ts::narrows global to the store scope and stamps only loader
        markers
      - >-
        packages/core/test/formal-r2-coreb-ingestion.test.ts::is idempotent on an id that already carries the store
        prefix
  packages/core/src/remote-recall.ts#tokenHealthKey:
    kind: guarantee
    rule: The health file never holds a credential; tokens are stored only as a truncated hash.
    tests:
      - packages/core/test/formal-r2-coreb-health.test.ts::never persists a token in the health file
  packages/core/src/remote-recall.ts#update:
    kind: guarantee
    rule: A write outcome is applied to the server's current health entry under the lock, never to an earlier snapshot.
    none: no test races two write outcomes against the health file
  packages/core/src/remote-recall.ts#withRemoteHealthLock:
    kind: guarantee
    rule: If the health-file lock cannot be taken, the work runs unlocked rather than failing recall or dropping a header.
    none: no test makes the lock unavailable and checks recall still runs
  packages/core/src/remote-recall.ts#writeRemoteHealth:
    kind: guarantee
    rule: Health state is written atomically under a unique temporary name, and a failed write never breaks recall.
    none: no test checks concurrent or failing health-file writes
