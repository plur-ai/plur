name: Windows init hooks

# Decision H3 (#1267): Windows hook commands must run under every shell an
# editor may use. This job runs `plur init` into a temporary HOME whose path
# contains a space, then executes every generated hook exactly as written —
# Claude Code's exec form with no shell, and each Cursor/Codex/Antigravity
# string through bash -c, pwsh -NoProfile -Command and cmd /C — and checks
# that each one reached the CLI with its subcommand (scripts/windows-hook-probe.mjs).
# It then re-runs init and requires unchanged hook counts per editor, and
# `plur doctor` to report hasPlurHooks for each editor's hooks file.
# A second step (#1603) puts a stub npm `codex.cmd` on PATH and requires
# `plur init --codex` to register plur through it (scripts/windows-codex-probe.mjs).
# Actions are pinned by commit SHA.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'packages/cli/**'
      - 'packages/mcp/**'
      - 'packages/core/**'
      - 'scripts/windows-hook-probe.mjs'
      - 'scripts/windows-codex-probe.mjs'
      - '.github/workflows/windows-init.yml'

permissions:
  contents: read

concurrency:
  group: windows-init-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-init-hooks:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the CLI and the MCP server (with their workspace dependencies)
        run: pnpm --filter "@plur-ai/cli..." --filter "@plur-ai/mcp..." build
      - name: 8.3 short names on the temp volume (informational)
        shell: cmd
        run: fsutil 8dot3name query %TEMP:~0,2% || exit /b 0
      - name: Run every generated hook through bash, pwsh and cmd
        run: node scripts/windows-hook-probe.mjs
      - name: plur init --codex registers plur through an npm codex.cmd (#1603)
        run: node scripts/windows-codex-probe.mjs
