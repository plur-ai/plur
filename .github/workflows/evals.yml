name: Evals

# Promise evals (evals/README.md). Local first (owner, 2026-10-18: "For CI and
# evals, we should do as much local as possible. Let's not burn GitHub usage
# where we don't need to."). GitHub runs only what must be enforced at merge:
#   gate     pull requests into development and main, and pushes to them: a
#            promise that was green may not go red, and an eval may not change
#            in the same pull request as the code it judges (owner, 2026-10-18:
#            work merges into development, and development goes to main)
#   formal   the same pull requests, when they touch the Lean models or the
#            code they cover
# The nightly (planted bugs, full scoreboard, private holdout) and the agent
# evals run locally: scripts/evals-local.sh nightly | agents, on the overnight
# machine. Both jobs stay here for a manual run only (workflow_dispatch).
# Stacked pull requests into other branches are proven locally by the same
# script (scripts/evals-local.sh gate) and get the GitHub gate once, when their
# branch comes into development.

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]
  workflow_dispatch:
    inputs:
      agents:
        description: 'Also run the agent-behaviour evals (real model runs, costs money)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

env:
  # The real embedding model, cached between runs (owner decision 2026-10-14:
  # pull-request checks may use it).
  PLUR_MODEL_CACHE_DIR: ${{ github.workspace }}/../plur-model-cache

jobs:
  gate:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: An eval and the code it judges never change in one pull request
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/test_check_eval_separation.py
          python3 scripts/check-eval-separation.py "origin/${{ github.base_ref }}"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9    # as ci.yml; without it the setup step fails (audit E-02)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ env.PLUR_MODEL_CACHE_DIR }}
          key: plur-models-bge-small-en-v1.5
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      # The harness's own tests run real vitest (second audit R-04, R-06), so after install.
      - name: The harness's own tests
        run: python3 scripts/test_evals_harness.py
      # Install and build ran this change's package scripts; none of them may have
      # rewritten the judge on the way to the gate.
      - name: The judge is as committed
        run: bash scripts/judge-intact.sh
      # Fails when a promise recorded green in evals/baseline.json is red now, when the
      # baseline is missing or unreadable, when a retirement is invalid, and (on a pull
      # request) when a promise green in the target branch's baseline was dropped without
      # being retired. Called directly, never through a package.json script, which this
      # pull request could have rewritten (second audit R-02). EVALS_BOOTSTRAP is a
      # repository variable only the owner can set, for the one pull request that brings
      # the evals to a base without them (evals/README.md, "First baseline"); the gate
      # ignores it once the base has an evals config.
      - name: Gate
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 .evals/gate.py --config evals/evals.yaml --base "origin/${{ github.base_ref }}" ${{ vars.EVALS_BOOTSTRAP == 'true' && '--bootstrap' || '' }}
          else
            python3 .evals/gate.py --config evals/evals.yaml
          fi
      # The full board, for reading; not-yet-green promises do not fail the run.
      - name: Scoreboard (informational)
        if: always()
        run: python3 .evals/run.py --config evals/evals.yaml --json > scoreboard.json || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: evals-scoreboard
          path: scoreboard.json

  formal:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Skip unless the models or the code they cover changed
        id: touched
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if python3 spec/formal/formal_check.py --project spec/formal --base "$base" --if-touched --no-build | grep -q "nothing verified changed"; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Lean (elan)
        if: steps.touched.outputs.run == 'true'
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      # Build, no proof gaps, allowed axioms only. Drift (covered code changed,
      # model did not) is reported but does not fail: index.ts is covered and
      # changes in most pull requests.
      - name: Proofs still hold
        if: steps.touched.outputs.run == 'true'
        run: python3 spec/formal/formal_check.py --project spec/formal --base "${{ github.event.pull_request.base.sha || github.event.before }}"

  nightly:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9    # as ci.yml; without it the setup step fails (audit E-02)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ env.PLUR_MODEL_CACHE_DIR }}
          key: plur-models-bge-small-en-v1.5
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      # The evals block the network, so the model must be in the cache before they run;
      # verify loads it with downloads off (second audit R-07).
      - name: The embedding model is in the cache and loads offline
        run: |
          node evals/helpers/provision-model.mjs fetch
          node evals/helpers/provision-model.mjs verify
      # The private holdout set (owner decision 2026-10-14). Without the token
      # this step fails: an unmeasured holdout is red, never skipped.
      - name: Fetch the private holdout set
        env:
          TOKEN: ${{ secrets.PLUR_EVALS_HOLDOUT_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "could not tell: secret PLUR_EVALS_HOLDOUT_TOKEN is not set"; exit 1; fi
          git clone --depth 1 --filter=blob:none --sparse "https://x-access-token:${TOKEN}@github.com/plur-ai/plur-space.git" ../holdout-src
          git -C ../holdout-src sparse-checkout set 1-tracks/engineering/evals-holdout
          echo "PLUR_EVAL_HOLDOUT_DIR=$(cd ../holdout-src/1-tracks/engineering/evals-holdout/recall-v1 && pwd)" >> "$GITHUB_ENV"
      # The holdout is pinned by content hash: a changed private set is caught, not
      # silently scored. Then both label sets are validated by the independent checker.
      - name: Holdout is the pinned version, and the labels are valid
        id: holdout
        run: |
          python3 evals/gold/hash_set.py "$PLUR_EVAL_HOLDOUT_DIR" --expect "$(cat evals/gold/holdout-recall-v1.sha256)"
          python3 evals/gold/check.py evals/gold/recall-v1 --other "$PLUR_EVAL_HOLDOUT_DIR"
          python3 evals/gold/hash_set.py "$PLUR_EVAL_HOLDOUT_DIR/../dedup-v2" --expect "$(cat evals/gold/holdout-dedup-v2.sha256)"
          python3 evals/gold/check.py --dedup evals/gold/dedup-v2 --same-pairs-as evals/gold/recall-v1
          python3 evals/gold/check.py --dedup "$PLUR_EVAL_HOLDOUT_DIR/../dedup-v2" --same-pairs-as "$PLUR_EVAL_HOLDOUT_DIR"
      # The paid agent evals run weekly, not here: they are listed as not-run, so a
      # healthy night can be green (audit E-05). Nothing is scored unless the holdout
      # check passed: a changed or missing holdout is never measured (second audit).
      - name: Scoreboard, including the holdout
        if: steps.holdout.outcome == 'success'
        run: python3 .evals/run.py --config evals/evals.yaml --exclude-kind agent --json > scoreboard.json
      # Runs after a red scoreboard too (red promises are expected), but never after a
      # failed holdout check.
      - name: Every planted bug turns its promise red
        if: ${{ !cancelled() && steps.holdout.outcome == 'success' }}
        run: python3 .evals/bite.py --config evals/evals.yaml --json > bite.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: evals-nightly
          path: |
            scoreboard.json
            bite.json

  agents:
    if: github.event_name == 'workflow_dispatch' && inputs.agents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9    # as ci.yml; without it the setup step fails (audit E-02)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ env.PLUR_MODEL_CACHE_DIR }}
          key: plur-models-bge-small-en-v1.5
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      # As nightly: the duplicate-handling eval embeds with the real model (R-07).
      - name: The embedding model is in the cache and loads offline
        run: |
          node evals/helpers/provision-model.mjs fetch
          node evals/helpers/provision-model.mjs verify
      - run: npm install -g @anthropic-ai/claude-code@2.1.300
      - name: Agent behaviour (pass^3 each)
        timeout-minutes: 45
        env:
          PLUR_AGENT_EVALS: '1'
          PLUR_AGENT_EVAL_LOG: ${{ github.workspace }}/agents-runs.log
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.PLUR_EVALS_CLAUDE_TOKEN }}
        run: python3 .evals/run.py --config evals/evals.yaml --agents --only "$(python3 -c "import sys,yaml;d=yaml.safe_load(open('evals/promises.yaml'));print(','.join(p['id'] for c in d['capabilities'] for p in c['promises'] if p.get('kind')=='agent'))")" --json > agents.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: evals-agents
          path: |
            agents.json
            agents-runs.log
