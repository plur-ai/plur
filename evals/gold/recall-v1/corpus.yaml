"memories":
  - "id": "M001"
    "scope": "global"
    "statement": "At Dovren Toolworks, write review summaries as three bullets followed by one explicit next action."
  - "id": "M002"
    "scope": "global"
    "statement": "At Dovren Toolworks, write incident summaries as three paragraphs followed by one explicit next action."
  - "id": "M003"
    "scope": "global"
    "statement": "Use amber labels, not red labels, for reversible changes because red implies permanent consequences."
  - "id": "M004"
    "scope": "global"
    "statement": "Use violet labels for irreversible changes because red implies an active outage."
  - "id": "M005"
    "scope": "global"
    "statement": "Keep unit test deadlines at eight seconds to expose accidental blocking."
  - "id": "M006"
    "scope": "global"
    "statement": "Keep integration test deadlines at ninety seconds to accommodate simulated transport delays."
  - "id": "M007"
    "scope": "global"
    "statement": "Present file sizes in decimal kilobytes when drafting customer facing notes."
  - "id": "M008"
    "scope": "global"
    "statement": "Present file sizes in binary kibibytes when drafting operator facing notes."
  - "id": "M009"
    "scope": "global"
    "statement": "Request a second reviewer before merging changes that alter access permissions."
  - "id": "M010"
    "scope": "global"
    "statement": "Request a security rehearsal before merging changes that alter credential rotation."
  - "id": "M011"
    "scope": "global"
    "statement": "Archive abandoned design proposals after forty days without any discussion."
  - "id": "M012"
    "scope": "global"
    "statement": "Archive accepted design proposals after their corresponding implementation has shipped."
  - "id": "M013"
    "scope": "global"
    "statement": "Use full sentences in error messages because fragments hide the responsible actor."
  - "id": "M014"
    "scope": "global"
    "statement": "Use short noun phrases in navigation captions because space is constrained."
  - "id": "M015"
    "scope": "global"
    "statement": "Attach a reproduction transcript to bug reports involving command execution."
  - "id": "M016"
    "scope": "global"
    "statement": "Attach an annotated screenshot to bug reports involving visual alignment."
  - "id": "M017"
    "scope": "global"
    "statement": "Schedule routine dependency reviews on the first Tuesday of each month."
  - "id": "M018"
    "scope": "global"
    "statement": "Schedule emergency dependency reviews immediately after a credible vulnerability notice."
  - "id": "M019"
    "scope": "global"
    "statement": "Store temporary investigation notes in the local scratch ledger until resolution."
  - "id": "M020"
    "scope": "global"
    "statement": "Store final investigation notes in the shared decision ledger after resolution."
  - "id": "M021"
