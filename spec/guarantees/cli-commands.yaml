anchors:
  packages/cli/src/commands/audit.ts#detectEntityConflict:
    kind: note
    why: "Describes how the conflict heuristic matches negation phrases; it states no rule the code must keep."
  packages/cli/src/commands/audit.ts#printText:
    kind: guarantee
    rule: "With --quiet, plur audit still prints its findings; only the banner and hints are dropped."
    none: "no test runs plur audit with --quiet"
  packages/cli/src/commands/audit.ts#refused:
    kind: guarantee
    rule: "plur audit is refused in a remote-only folder."
    tests: ["packages/cli/test/folder-remote-only.test.ts::plur tensions --scan and plur audit are refused in a remote-only folder"]
  packages/cli/src/commands/checkpoint.ts#data:
    kind: note
    why: "Explains that core refuses to attest an unreadable store; this code only turns that throw into a readable message."
  packages/cli/src/commands/checkpoint.ts#run:
    kind: guarantee
    rule: "plur checkpoint on a store with no engrams.yaml exits 1 with an explanation instead of crashing."
    none: "no test runs plur checkpoint on an empty store"
  packages/cli/src/commands/doctor.ts#buildOpencodeReport:
    kind: guarantee
    rule: "When the registry lookup is skipped or cannot answer, doctor reports the opencode plugin as unknown, never as a wrong yes or no."
    tests: ["packages/cli/test/doctor.test.ts::reports pluginResolvable: unknown (never a false"]
  packages/cli/src/commands/doctor.ts#checkEmbedder.env:
    kind: note
    why: "Explains why the probe child gets a marker variable; the refusal itself lives in the probe command."
  packages/cli/src/commands/doctor.ts#checkOpencodePluginPublished:
    kind: guarantee
    rule: "The npm registry lookup is bounded so doctor never hangs, and offline or failed lookups answer unknown."
    tests: ["packages/cli/test/doctor-offline-no-network.test.ts::offline: no request, answer unknown"]
  packages/cli/src/commands/doctor.ts#checkOutbox:
    kind: guarantee
    rule: "The outbox check never throws; an unreadable store is reported as no outbox data."
    none: "no test makes the outbox read fail inside doctor"
  packages/cli/src/commands/doctor.ts#claims_problem:
    kind: note
    why: "Explains why an unrecordable push claim matters; the failing verdict is stated on the report type."
  packages/cli/src/commands/doctor.ts#claudeCodeHooks:
    kind: note
    why: "Explains why hooks without the MCP server count as a broken half-install."
  packages/cli/src/commands/doctor.ts#ClaudeCodeMcpReport:
    kind: guarantee
    rule: "A plur entry in ~/.claude/settings.json never counts as a Claude Code MCP registration."
    tests: ["packages/cli/test/init-claude-user-mcp-1561.test.ts::hooks installed, server only in settings.json: not registered, fails, and names the fix"]
  packages/cli/src/commands/doctor.ts#codexReport:
    kind: guarantee
    rule: "The Codex check judges only the Codex registration; another working editor never makes it pass."
    tests: ["packages/cli/test/codex-runtime-1623.test.ts::doctor fails without a Codex registration even if another editor works"]
  packages/cli/src/commands/doctor.ts#DEFAULT_PROBE_TIMEOUT_MS:
    kind: note
    why: "Explains why the probe timeout is long: hooks cannot finish the first model download."
  packages/cli/src/commands/doctor.ts#DoctorReport:
    kind: guarantee
    rule: "A server registered only in settings.json, an unset token variable, a queued team write that can never be delivered, or a broken folder map each fail the overall check; token values are never shown."
    tests: ["packages/cli/test/init-claude-user-mcp-1561.test.ts::hooks installed, server only in settings.json: not registered, fails, and names the fix", "packages/cli/test/doctor.test.ts::an unset token_env variable fails the overall verdict and the exit code", "packages/cli/test/doctor.test.ts::reports a store whose token_env variable is unset, without a value", "packages/cli/test/outbox-needs-action.test.ts::plur doctor fails the outbox check on a 403-refused write and exits non-zero"]
  packages/cli/src/commands/doctor.ts#finish:
    kind: guarantee
    rule: "Every handshake verdict names the server command that was probed."
    none: "no test asserts the probed subject on the handshake result"
  packages/cli/src/commands/doctor.ts#hasPlur:
    kind: guarantee
    rule: "A commented-out Codex plur table, or one named like plurality, does not count as a plur registration."
    none: "no test feeds doctor a commented-out or look-alike Codex table"
  packages/cli/src/commands/doctor.ts#isClaudeSettingsFile:
    kind: note
    why: "States a fact about Claude Code: it never reads MCP servers from its settings files."
  packages/cli/src/commands/doctor.ts#OpencodeReport:
    kind: guarantee
    rule: "An opencode plugin whose resolvability cannot be determined is reported unknown, never coerced to yes or no."
    tests: ["packages/cli/test/doctor.test.ts::reports pluginResolvable: unknown (never a false"]
  packages/cli/src/commands/doctor.ts#plur:
