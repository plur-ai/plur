name: Linux real editors release replay
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        scenario: [fresh, from-0.19.4, from-0.21.2]
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      PLUR_EDITORS_REQUIRED: claude,codex,opencode
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Stamp the tested build
        run: node scripts/ci-stamp-version.mjs "ci.${GITHUB_SHA:0:8}" >> "$GITHUB_ENV"
      - run: pnpm --filter "@plur-ai/cli..." --filter "@plur-ai/mcp..." --filter "@plur-ai/opencode..." build
      - name: Install packed build and pinned native editor CLIs
        run: |
          tb="$RUNNER_TEMP/plur-tarballs"
          mkdir -p "$tb"
          for p in core mcp cli opencode; do
            (cd "packages/$p" && pnpm pack --pack-destination "$tb")
          done
          echo "PLUR_TARBALLS=$tb" >> "$GITHUB_ENV"
          npm install -g --no-audit --no-fund "$tb"/plur-ai-core-*.tgz "$tb"/plur-ai-mcp-*.tgz "$tb"/plur-ai-cli-*.tgz
          npm install -g --no-audit --no-fund @anthropic-ai/claude-code@2.1.289 @openai/codex@0.160.0 opencode-ai@1.18.34
          claude --version
          codex --version
          opencode --version
      - name: Replay the actual setup and upgrade path
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: node scripts/windows-editors-probe.mjs --scenario "$SCENARIO"
