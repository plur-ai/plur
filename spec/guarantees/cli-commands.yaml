    tests: ["packages/cli/test/folders-repair.test.ts::non-interactive without --yes is a dry run: shows the diff, changes nothing, exits nonzero", "packages/cli/test/folders-repair.test.ts::--yes: backup, atomic write, re-checked, exit 0"]
  packages/cli/src/commands/folders.ts#repairCommandFor:
