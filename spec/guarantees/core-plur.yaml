anchors:
  packages/core/src/plur/config-stores.ts#after:
    kind: guarantee
    rule: >-
      Saving the stores list replaces config.yaml atomically, so a crash mid-write leaves the previous complete config
      rather than a truncated one.
    none: no test crashes a stores write mid-way; the atomic-write helper is tested on its own, not through this writer
  packages/core/src/plur/config-stores.ts#canonicalStorePath:
    kind: guarantee
    rule: >-
      The primary store file is never registered as a secondary store under any spelling, and another spelling of a
      registered store counts as the same store.
    tests:
      - >-
        packages/core/test/duplicate-primary-store.test.ts::addStore refuses a path that canonicalises to the primary
        store
      - >-
        packages/core/test/duplicate-primary-store.test.ts::addStore treats another spelling of a registered store as
        already registered
  packages/core/src/plur/config-stores.ts#ConfigStoresMethods:
    kind: guarantee
    rule: >-
      A new key for a server entry is written only onto the one entry it came from, and is refused with nothing written
      when no entry or more than one matches; an entry read from an environment variable stores the variable name, never
      the token.
    tests:
      - >-
        packages/core/test/server-entry-writeback-identity.test.ts::a scope that two server entries on one url both list
        is refused and nothing changes
      - packages/core/test/config-token-env-1561.test.ts::addStore with tokenEnv writes the reference, not the token
  packages/core/src/plur/config-stores.ts#configStoresMethods._loadConfig:
    kind: guarantee
    rule: When two configured scopes share one id prefix, every action by a namespaced id for them is refused.
    tests:
      - >-
        packages/core/test/team-id-prefix-followups.test.ts::two configured scopes sharing a prefix: an action by
        namespaced id is refused and changes nothing
  packages/core/src/plur/config-stores.ts#configStoresMethods.addRemoteStore:
    kind: guarantee
    rule: >-
      Registering a remote store for a scope another store already holds is refused unless the caller explicitly asks to
      overwrite, and the overwrite happens only after the server verified the token.
    tests:
      - >-
        packages/core/test/add-remote-store.test.ts::refuses without overwriteScope, naming the option, and writes
        nothing
      - >-
        packages/core/test/add-remote-store.test.ts::with overwriteScope but a rejected token, the existing entry is
        untouched
  packages/core/src/plur/config-stores.ts#configStoresMethods.addStore:
    kind: guarantee
    rule: >-
      One scope of a server entry cannot be replaced on its own; adding a store with a token taken from an environment
      variable stores only the variable name; re-adding an existing store is idempotent.
    tests:
      - >-
        packages/core/test/multi-scope-store-entry.test.ts::replacing one scope of a server entry with another store is
        refused and changes nothing
      - packages/core/test/config-token-env-1561.test.ts::addStore with tokenEnv writes the reference, not the token
  packages/core/src/plur/config-stores.ts#configStoresMethods.persistStores:
    kind: guarantee
    rule: >-
      Saving the stores list never truncates a live config.yaml when it cannot be read, and a key update that matches no
      entry or several is refused with nothing written.
    lean:
      - PlurSpec/StoreEntry.lean:mistarget_impossible
    tests:
      - >-
        packages/core/test/pr3-config-robustness.test.ts::aborts the write (does not discard auto_learn/embeddings/etc)
        when the config read fails transiently
      - >-
        packages/core/test/server-entry-writeback-identity.test.ts::a scope that two server entries on one url both list
        is refused and nothing changes
  packages/core/src/plur/config-stores.ts#configStoresMethods.registerEnterpriseServer:
    kind: guarantee
    rule: >-
      Registering a company server refuses to replace a sign-in config.yaml already holds when asked to keep it, and a
      credential write that cannot be made owner-only is refused without the key appearing in the error.
    lean:
      - PlurSpec/Persistence.lean:every_config_writer_protected
    tests:
      - >-
        packages/core/test/register-enterprise-server-stale.test.ts::keepSignIn: a sign-in config.yaml holds for the
        server is never replaced; nothing is written
  packages/core/src/plur/config-stores.ts#configStoresMethods.verifyRemoteStore:
    kind: guarantee
    rule: >-
      Verifying a remote store refuses a scope held by a different store unless overwrite was asked, and never allows
      overwriting one scope of a server entry.
    tests:
      - >-
        packages/core/test/multi-scope-store-entry.test.ts::verifyRemoteStore refuses the same replacement before
        anything is written
      - packages/core/test/add-remote-store.test.ts::refuses what addRemoteStore refuses, with the same codes
  packages/core/src/plur/config-stores.ts#driver:
    kind: guarantee
    rule: A token that has not yet been verified is never cached as the server's driver.
    none: no test checks that a rejected token leaves no cached driver
  packages/core/src/plur/config-stores.ts#keyOf:
    kind: guarantee
    rule: >-
      The stores write-back matches entries by url plus scope (or path plus scope), never by url alone, so changing one
      scope of a server leaves its other scopes untouched.
    tests:
      - >-
        packages/core/test/pr3-config-robustness.test.ts::rotating one of two same-url/different-scope stores leaves the
        other untouched (url+scope key)
  packages/core/src/plur/config-stores.ts#localMatches:
    kind: guarantee
    rule: A store entry ignored at load is never reported as the registration that covers a path.
    tests:
      - packages/core/test/duplicate-primary-store.test.ts::addStore on the path of an ignored duplicate says so
  packages/core/src/plur/config-stores.ts#outbox:
    kind: guarantee
    rule: >-
      Registering a company server reads the outbox before writing the key, so an unreadable outbox fails the
      registration with nothing written.
    tests:
      - >-
        packages/core/test/register-enterprise-server.test.ts::an unreadable outbox fails the registration before
        anything is written
  packages/core/src/plur/config-stores.ts#rawArray:
    kind: guarantee
    rule: >-
      A write-back keeps a token_env reference and never writes the resolved token, and lands each entry on its own
      on-disk entry by identity, never by position.
    lean:
      - PlurSpec/StoreEntry.lean:identity_stable
      - PlurSpec/StoreEntry.lean:mistarget_impossible
    tests:
      - >-
        packages/core/test/multi-scope-store-entry.test.ts::token_env on a server entry is never written back as a
        resolved token
      - >-
        packages/core/test/server-entry-writeback-identity.test.ts::metadata computed before another process inserted a
        server entry at index 0 lands on its own entry
  packages/core/src/plur/discovery.ts#coversMatch:
    kind: guarantee
    rule: >-
      Syncing server scope metadata writes config.yaml only when the value it would persist differs, so repeated syncs
      of the same answer converge to no writes.
    tests:
      - packages/core/test/scope-metadata-trust.test.ts::two consecutive syncs with identical server metadata
      - >-
        packages/core/test/scope-metadata-sync.test.ts::is a no-op when metadata matches existing covers (no spurious
        write)
  packages/core/src/plur/discovery.ts#DiscoveryMethods:
    kind: guarantee
    rule: >-
      A failed or degraded server answer never replaces a non-empty cached scope list, and a server can only tighten the
      local leak guard, never loosen it with an allow list.
    lean:
      - PlurSpec/RoutingDiscovery.lean:nonempty_cache_replaced_only_by_ok
      - PlurSpec/RoutingDiscovery.lean:malformed_keeps_cache
    tests:
      - >-
        packages/core/test/refresh-server-scopes.test.ts::a later 503 leaves scope, scopes and discovery.discovered_at
        byte-identical and reports failed
      - >-
        packages/core/test/scope-metadata-trust.test.ts::drops a hostile remote allow; the guard still demotes sensitive
        content
  packages/core/src/plur/discovery.ts#discoveryMethods.checkServerStores:
    kind: guarantee
    rule: The server check reports a malformed server entry instead of silently treating it as nothing to check.
    tests:
      - >-
        packages/core/test/check-server-stores.test.ts::reports a malformed enterprise entry instead of silently
        dropping its server
  packages/core/src/plur/discovery.ts#discoveryMethods.persistDismissedScopes:
    kind: guarantee
    rule: Saving dismissed scopes replaces config.yaml atomically, so a crash mid-write leaves the previous complete config.
    none: no test crashes a dismissed-scopes write mid-way
  packages/core/src/plur/discovery.ts#discoveryMethods.refreshServerScopes:
    kind: guarantee
    rule: When two server entries share a url, a server answer is written to neither of them.
    lean:
      - PlurSpec/RoutingDiscovery.lean:answer_lands_on_its_entry
    tests:
      - packages/core/test/formal-routing-discovery.test.ts::neither entry is written and both outcomes are failed
  packages/core/src/plur/discovery.ts#dismissed:
    kind: guarantee
    rule: Batch registration of discovered scopes never registers a scope the user dismissed.
    tests:
      - >-
        packages/core/test/scope-discovery.test.ts::batch register respects dismissals: a dismissed scope is NOT
        registered and stays dismissed
  packages/core/src/plur/discovery.ts#dismissedSet:
    kind: guarantee
    rule: A dismissed scope is not offered again when the server re-advertises it in different letter case.
    tests:
      - packages/core/test/scope-discovery.test.ts::dismissed-scope matching is case-insensitive
  packages/core/src/plur/discovery.ts#results:
    kind: guarantee
    rule: >-
      Batch registration never auto-registers a personal-family scope a server lists, skips dismissed scopes, and one
      failing scope does not abort the rest of the batch.
    tests:
      - packages/core/test/scope-discovery.test.ts::#382 refuses to auto-register personal-family scopes returned by /me
      - packages/core/test/scope-discovery.test.ts::batch register respects dismissals
  packages/core/src/plur/discovery.ts#timeoutHandle:
    kind: guarantee
    rule: Listing stores with remote counts never hangs on an unresponsive remote; its load is cut off by a timeout.
    none: no test lists stores against a hanging remote
  packages/core/src/plur/feedback-pin.ts#entry:
    kind: guarantee
    rule: Rating a memory under an explicit scope that two servers claim is refused before either server is asked.
    lean:
      - PlurSpec/RoutingDiscovery.lean:lookup_refuses_conflict
    tests:
      - packages/core/test/project-scope-routing.test.ts::feedback is refused and no server is rated
  packages/core/src/plur/feedback-pin.ts#FeedbackPinMethods:
    kind: guarantee
    rule: >-
      An automatic rating moves ranking only and never changes a memory's commitment; the hard pinned tier can never
      grow past its share of the pinned quota.
    tests:
      - >-
        packages/core/test/feedback-auto-source.test.ts::moves retrieval_strength and never commitment, however many
        times it fires
      - packages/core/test/pinned-two-tier-safety.test.ts::is a fraction of the pinned quota and never exceeds it
      - >-
        packages/core/test/pinned-two-tier-safety.test.ts::holds under concurrent writes (committed total never exceeds
        it)
    promises:
      - FDB-2
  packages/core/src/plur/feedback-pin.ts#feedbackPinMethods._assertHardTierFits:
    kind: guarantee
    rule: Editing or retiring a memory that is no longer active is never refused because the hard pinned tier is full.
    tests:
      - packages/core/test/pinned-two-tier-safety.test.ts::editing an already-retired hard engram succeeds
      - >-
        packages/core/test/pinned-two-tier-safety.test.ts::retiring a hard engram via updateEngram succeeds even when
        the statement grows
  packages/core/src/plur/feedback-pin.ts#feedbackPinMethods._reconcileQueuedScope:
    kind: guarantee
    rule: >-
      A save queued from a remote-only folder is never turned into a local row by an update that changes its scope; such
      an update is refused.
    tests:
      - >-
        packages/core/test/folder-remote-only-guard.test.ts::a queued remote-only save cannot be rescoped or updated to
        a local scope, bound or not
  packages/core/src/plur/feedback-pin.ts#feedbackPinMethods.feedback:
    kind: guarantee
    rule: >-
      Rating with scope primary never rates a remote memory, and an explicit scope only ever rates a row of a store that
      claims exactly that scope.
    lean:
      - PlurSpec/RoutingDiscovery.lean:walk_exact
    tests:
      - >-
        packages/core/test/project-scope-routing.test.ts::feedback with a personal scope a local store keeps does not
        rate a row of another url store
      - >-
        packages/core/test/project-scope-routing.test.ts::feedback with a project scope the company server withholds is
        refused, nothing rated
  packages/core/src/plur/feedback-pin.ts#feedbackPinMethods.pinnedQuota:
    kind: guarantee
    rule: Pricing a pin does not charge an engram that is already pinned, so a re-pin is never refused by its own cost.
    tests:
      - packages/core/test/pinned-quota.test.ts::does not charge a re-pin of something already pinned
  packages/core/src/plur/feedback-pin.ts#feedbackPinMethods.setPinned:
    kind: guarantee
    rule: >-
      A namespaced id is pinned only in the store it names, a readonly store's row is never pinned through a bare id,
      and re-pinning an already pinned memory is never refused.
    tests:
      - >-
        packages/core/test/pinned-two-tier-safety.test.ts::re-pinning an engram that was already pinned is not refused
        and not reverted
      - >-
        packages/core/test/project-scope-routing.test.ts::setPinned keeps the selection of a readonly local store: no
        PATCH to the url store
  packages/core/src/plur/feedback-pin.ts#found:
    kind: guarantee
    rule: Rating by a bare id with no scope is refused when the same id also exists in a remote store.
    lean:
      - PlurSpec/R2CoreA.lean:fresh_cache_answers
    tests:
      - >-
        packages/core/test/formal-r2-corea-guard-cache.test.ts::feedback: after a cold-cache push, an id that also lives
        remotely is refused as ambiguous
  packages/core/src/plur/feedback-pin.ts#probedOutsideLock:
    kind: guarantee
    rule: An automatic rating never waits on the network, and moves strength one step but never commitment.
    tests:
      - >-
        packages/core/test/feedback-auto-source.test.ts::moves retrieval_strength and never commitment, however many
        times it fires
  packages/core/src/plur/feedback-pin.ts#quotaScope:
    kind: guarantee
    rule: The pin quota does not price a candidate in a scope two servers claim, and asks no server for it.
    tests:
      - >-
        packages/core/test/project-scope-routing.test.ts::pinnedQuota does not cost a candidate on whichever server is
        listed first
  packages/core/src/plur/feedback-pin.ts#reverted:
    kind: note
    why: >-
      Explains that a revert always restores "not pinned" because a memory pinned before the call never reaches this
      branch; the re-pin rule itself is anchored on setPinned.
  packages/core/src/plur/feedback-pin.ts#scopedEntry:
    kind: guarantee
    rule: >-
      A pin under an explicit scope never sends a PATCH to a readonly store, and a scope two writable servers claim is
      refused before either is asked.
    lean:
      - PlurSpec/RoutingDiscovery.lean:lookup_refuses_conflict
    tests:
      - packages/core/test/project-scope-routing.test.ts::setPinned is refused and no server is patched
  packages/core/src/plur/feedback-pin.ts#scopeMoveChecked:
    kind: guarantee
    rule: The live probe for a scope-move id collision runs before the store lock is taken, never while holding it.
    none: no test checks that this probe runs outside the store lock
  packages/core/src/plur/feedback-pin.ts#target:
    kind: guarantee
    rule: >-
      An update to a queued row goes to the one store the resolver names for its scope, never to a parent-scope server,
      and a scope two servers claim refuses the whole update before anything is saved.
    lean:
      - PlurSpec/RoutingDiscovery.lean:retarget_is_router
      - PlurSpec/RoutingDiscovery.lean:retarget_refuses_conflict
    tests:
      - >-
        packages/core/test/folder-remote-only-gate1663.test.ts::a bare-id update goes only to the store the resolver
        names, not to a parent-scope server
      - >-
        packages/core/test/formal-routing-discovery.test.ts::is refused, and the row stays queued for its old server and
        scope
  packages/core/src/plur/feedback-pin.ts#walk:
    kind: guarantee
    rule: >-
      In a remote-only folder, an update by bare id is sent only to the store serving the row's own scope, never to
      another team server.
    tests:
      - >-
        packages/core/test/folder-remote-only-gate1663.test.ts::a bare-id update of a row in the folder scope is never
        sent to another team server
  packages/core/src/plur/feedback-pin.ts#writableRemotes:
    kind: guarantee
    rule: >-
      A remote update is awaited and its result reported; a failure never reads as success and a 404 is not reported as
      done.
    none: no test asserts that a failed remote update is reported rather than read as success
  packages/core/src/plur/folders-policy.ts#FoldersPolicyMethods:
    kind: guarantee
    rule: >-
      When a folder's decision cannot be resolved, memory fails closed and nothing is read or written; in a remote-only
      folder, lookups never answer from personal rows and operations on personal rows are refused.
    tests:
      - >-
        packages/core/test/folder-remote-only-every-method.test.ts::returns no personal statement and creates or changes
        no permanent row
    promises:
      - OFF-3
  packages/core/src/plur/folders-policy.ts#foldersPolicyMethods._discoveryCandidates:
    kind: guarantee
    rule: Project store discovery never walks into the home folder or above it.
    tests:
      - packages/core/test/folder-safety-1588.test.ts::a working folder outside any repository does not walk above HOME
      - >-
        packages/core/test/folder-safety-1588.test.ts::PLUR_PATH and the working folder under HOME, no .git: ~/.plur is
        never registered
  packages/core/src/plur/folders-policy.ts#foldersPolicyMethods.autoDiscoverStores:
    kind: guarantee
    rule: >-
      Store discovery reads the folder map but never performs the one-time import of a legacy trust.yaml, while still
      honouring a legacy grant.
    tests:
      - >-
        packages/core/test/folder-safety-1588.test.ts::P17 / R3-L2: discovery never imports a legacy trust.yaml, and
        still honours it
  packages/core/src/plur/folders-policy.ts#foldersPolicyMethods.setFolder:
    kind: guarantee
    rule: Setting a folder to a project scope that a company server withholds is refused, naming the server.
    tests:
      - >-
        packages/core/test/project-scope-routing.test.ts::Plur.setFolder threads the configured stores: an ungranted
        project scope is refused through the public method
  packages/core/src/plur/folders-policy.ts#home:
    kind: guarantee
    rule: The user's main store under ~/.plur is never registered as a project store, whichever store is active.
    tests:
      - >-
        packages/core/test/folder-safety-1588.test.ts::PLUR_PATH and the working folder under HOME, no .git: ~/.plur is
        never registered
      - packages/core/test/folder-safety-1588.test.ts::the active store is never registered as a project store
  packages/core/src/plur/folders-policy.ts#ownership:
    kind: guarantee
    rule: In a remote-only folder, an operation on a team-host row whose ownership cannot be determined is refused.
    tests:
      - >-
        packages/core/test/folder-remote-only-gate1663.test.ts::an ownership check that cannot tell refuses: a 503 then
        a personal row is never deleted
  packages/core/src/plur/folders-policy.ts#policy:
    kind: guarantee
    rule: Binding to a folder only reads the folder map and never imports a legacy trust.yaml.
    none: no test binds a folder with a legacy trust.yaml present and checks that nothing was imported
  packages/core/src/plur/folders-policy.ts#remoteScopes:
    kind: guarantee
    rule: A personal url store never qualifies as the destination of a remote-only folder.
    tests:
      - >-
        packages/core/test/folder-remote-only-gate1663.test.ts::a personal url scope cannot be a remote-only scope, and
        a hand-written one dials nothing
  packages/core/src/plur/folders-policy.ts#target:
    kind: guarantee
    rule: >-
      In a remote-only folder, a row on the team host must be in the folder's team scope; a lookup that fails refuses
      the operation.
    tests:
      - >-
        packages/core/test/folder-remote-only-gate1663.test.ts::a personal row on the team host is neither returned by
        id nor updated
      - packages/core/test/folder-remote-only-gate1663.test.ts::an ownership check that cannot tell refuses
  packages/core/src/plur/forget-rescope.ts#engrams:
    kind: guarantee
    rule: >-
      Rescope only moves a memory held in the local primary store; a namespaced secondary or remote row gets an error
      instead of a half-move.
    none: no test rescopes a namespaced secondary or remote id and checks it is refused unchanged
  packages/core/src/plur/forget-rescope.ts#entry:
    kind: guarantee
    rule: Forgetting under an explicit scope that two servers claim is refused before either server is asked to delete.
    lean:
      - PlurSpec/RoutingDiscovery.lean:lookup_refuses_conflict
    tests:
      - packages/core/test/project-scope-routing.test.ts::forget is refused and no server is asked to delete
  packages/core/src/plur/forget-rescope.ts#ForgetRescopeMethods:
    kind: guarantee
    rule: >-
      A rescope dry run changes nothing, and a remote rescope whose push fails leaves the source untouched with no
      outbox fallback.
    lean:
      - PlurSpec/WritePath.lean:rescope_one_reports
    tests:
      - packages/core/test/rescope.test.ts::dry_run mutates nothing on the remote route
      - packages/core/test/rescope.test.ts::authorization denied (401) fails loud and leaves the source untouched
    promises:
      - PRV-7
  packages/core/src/plur/forget-rescope.ts#forgetRescopeMethods.forget:
    kind: guarantee
    rule: >-
      Forget refuses ambiguous or unverifiable targets instead of guessing, only retires a row of the store an explicit
      scope names, and never reports a refused or unreachable store as the memory being absent.
    lean:
      - PlurSpec/RoutingDiscovery.lean:walk_exact
    tests:
      - >-
        packages/core/test/project-scope-routing.test.ts::forget with a personal scope a local store keeps does not
        retire a row of another url store
      - >-
        packages/core/test/walk-cannot-tell.test.ts::forget records an unreachable store instead of claiming plain
        absence
      - >-
        packages/core/test/folder-remote-only-guard.test.ts::forgetting a queued remote-only save deletes it; nothing
        stays local
    promises:
      - FGT-3
  packages/core/src/plur/forget-rescope.ts#forgetRescopeMethods.rescope:
    kind: guarantee
    rule: >-
      A save queued from a remote-only folder is never moved by rescope, and a rescope to a scope whose store is
      readonly for this client is refused up front.
    tests:
      - >-
        packages/core/test/folder-remote-only-guard.test.ts::a queued remote-only save cannot be rescoped or updated to
        a local scope, bound or not
      - packages/core/test/rescope.test.ts::readonly store entry is refused up-front
  packages/core/src/plur/forget-rescope.ts#foundInPrimary:
    kind: guarantee
    rule: >-
      Forgetting an already retired memory writes no second retirement to history, a cold cache never downgrades the
      ambiguity guard to first-match, and a forgotten memory's queued push is cancelled so it cannot be resurrected
      remotely.
    lean:
      - PlurSpec/WritePath.lean:merge_honours_cancellation
    tests:
      - >-
        packages/core/test/formal-r2-corea-guard-cache.test.ts::forget: after a cold-cache push, an id that also lives
        remotely is refused as ambiguous
      - >-
        packages/core/test/formal-writepath-outbox.test.ts::B: a forget() landing while the flush POST is in flight is
        not erased
    promises:
      - FGT-1
  packages/core/src/plur/forget-rescope.ts#hash:
    kind: guarantee
    rule: >-
      Rescoping a memory whose identical content already exists at the target scope succeeds without creating a
      duplicate.
    tests:
      - >-
        packages/core/test/rescope.test.ts::dedup on target (constraint 5): identical engram already at the target is
        idempotent success
  packages/core/src/plur/forget-rescope.ts#isLocalFamily:
    kind: note
    why: >-
      Explains that the local-family check on a rescope target is case-sensitive as typo protection, because the target
      is written verbatim; no rule beyond that choice.
  packages/core/src/plur/forget-rescope.ts#msg:
    kind: guarantee
    rule: When a remote rescope push does not land, the source stays exactly as it was and no outbox retry is queued.
    tests:
      - packages/core/test/rescope.test.ts::authorization denied (401) fails loud and leaves the source untouched
  packages/core/src/plur/forget-rescope.ts#ownership:
    kind: guarantee
    rule: >-
      The forget walk never claims a store that did not answer holds no such memory; for a bare id it continues past it
      and names it in the result.
    tests:
      - >-
        packages/core/test/walk-cannot-tell.test.ts::forget records an unreachable store instead of claiming plain
        absence
      - packages/core/test/remote-routing.test.ts::forget(namespaced-id) with unreachable remote throws actionable error
  packages/core/src/plur/forget-rescope.ts#retired:
    kind: guarantee
    rule: A rescope whose source vanished or was already retired during the push records no retirement in history.
    lean:
      - PlurSpec/WritePath.lean:rescope_one_reports
    tests:
      - >-
        packages/core/test/formal-writepath-rescope.test.ts::a source that vanished during the push gets no
        engram_retired history event
  packages/core/src/plur/forget-rescope.ts#unreachedStores:
    kind: guarantee
    rule: >-
      A forget that could not reach some stores never reports plain absence, and an unreachable store does not stop the
      retire elsewhere.
    tests:
      - >-
