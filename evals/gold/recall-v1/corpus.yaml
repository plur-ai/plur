    "scope": "project:brindle"
    "statement": "Command aliases belong in the workspace alias manifest checked into version control."
  - "id": "M026"
    "scope": "project:brindle"
    "statement": "Personal aliases belong in the private alias manifest excluded from version control."
  - "id": "M027"
    "scope": "project:brindle"
    "statement": "Use a colon between command groups because slashes suggest filesystem paths."
  - "id": "M028"
    "scope": "project:brindle"
    "statement": "Use a dash between option words because underscores are reserved for generated fields."
