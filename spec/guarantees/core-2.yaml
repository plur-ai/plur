anchors:
  packages/core/src/hybrid-search.ts#applyReranker:
    kind: guarantee
    rule: When the optional reranker fails, recall still returns its results in the fused order instead of failing.
    tests:
      - packages/core/test/hybrid-rerank.test.ts::falls back to original order if the reranker throws
  packages/core/src/hybrid-search.ts#reranked:
    kind: guarantee
    rule: Recall still returns results when the rerank stage fails.
    tests:
      - packages/core/test/hybrid-rerank.test.ts::falls back to original order if the reranker throws
  packages/core/src/index.ts#(module):
    kind: note
    why: Export comments that point to where directory trust, remote-only refusals and atomic file writes are defined.
  packages/core/src/index.ts#BINDING_CAPTURED:
    kind: guarantee
    rule: >-
      A public call keeps the folder binding that was in effect when it started, even if the instance is rebound while
      the call waits.
    tests:
      - >-
        packages/core/test/remote-only-binding-capture.test.ts::a rebind mid-call does not change what a remote-only
        call sees
      - packages/core/test/remote-only-binding-capture.test.ts::each public prototype method carries the capture wrapper
  packages/core/src/index.ts#Plur:
    kind: note
    why: Explains when the sqlite index is built by default and when it needs an explicit setting.
  packages/core/src/index.ts#Plur._basePrimaryStore:
    kind: note
    why: Tells maintainers to reach primary engram state through the store rather than the raw file helpers.
  packages/core/src/index.ts#Plur._heldBy:
    kind: note
    why: Explains why the holding server is tracked beside the row instead of on it.
  packages/core/src/index.ts#Plur._llmFailures:
    kind: note
    why: Explains why LLM failures are kept as a time window rather than a counter.
  packages/core/src/index.ts#Plur._meIdentities:
    kind: guarantee
    rule: >-
      An unscoped write is not routed into a personal server scope unless the token's latest identity lookup succeeded;
      never fetched, offline or rejected all count as unknown.
    lean:
      - PlurSpec/ScopeInject.lean:autoRoute_me_only
    tests:
      - >-
        packages/core/test/formal-apply-core-me-only.test.ts::unknown /me identity (never fetched) → refused, fails
        closed, nothing POSTed
      - packages/core/test/formal-apply-core-me-only.test.ts::/me unreachable → still refused
  packages/core/src/index.ts#Plur._metadataOnly:
    kind: guarantee
    rule: In a remote-only folder, history keeps only metadata; free text in an event is never recorded.
    none: no test checks which history fields are dropped in a remote-only folder
  packages/core/src/index.ts#Plur._queueRetireRemote:
    kind: guarantee
    rule: >-
      A queued remote retire only ever deletes the server copy, never re-sends it, and queuing it twice for the same
      server id changes nothing.
    tests:
      - >-
        packages/core/test/formal-apply-core-retire-remote.test.ts::flush path: forget during the flush POST queues a
        retire; the next flush DELETEs it once and never re-POSTs
  packages/core/src/index.ts#Plur._remoteDelivered:
    kind: note
    why: Describes an in-memory record of server-confirmed writes; it states no rule of its own.
  packages/core/src/index.ts#Plur._remoteOnlyContext:
    kind: guarantee
    rule: In a remote-only folder, a write to a scope two servers claim is refused with nothing written.
    tests:
      - >-
        packages/core/test/formal-remote-only-gate.test.ts::a team scope two servers claim is refused with
        ScopeConflictError; nothing is written
  packages/core/src/index.ts#Plur._remoteStores:
    kind: guarantee
    rule: Peeking at a remote store's cache never triggers a network load; it returns nothing until the cache is warmed.
    none: no test checks that the cache peek makes no request
  packages/core/src/index.ts#Plur._rerankerEvalAdvisoryDone:
    kind: guarantee
    rule: A harmful reranker self-evaluation is logged once as advice and never turns the reranker off.
    tests:
      - >-
        packages/core/test/reranker-eval.test.ts::logs the harmful advisory ONCE when the env-configured reranker
        engages — and keeps reranking
  packages/core/src/index.ts#Plur._secondaryStores:
    kind: note
    why: States that file-backed secondary stores use YAML; an implementation fact, not a rule.
  packages/core/src/index.ts#Plur.close:
    kind: guarantee
    rule: Closing an instance stops it recording a shared store's id renames but leaves the store itself open for its owner.
    tests:
      - >-
        packages/core/test/formal-r2-apply-persist-nothing-hidden.test.ts::several Plur instances on one adapter all
        record the rename; a closed one stops
  packages/core/src/index.ts#Plur.resolveAutoDiscover:
    kind: note
    why: Explains why an environment variable can turn constructor-time discovery off.
  packages/core/src/index.ts#renameSink:
    kind: guarantee
    rule: >-
      When a shared store renames a clashing id, every attached instance records the rename in its history; it is never
      only logged.
    tests:
      - >-
        packages/core/test/formal-r2-apply-persist-nothing-hidden.test.ts::several Plur instances on one adapter all
        record the rename; a closed one stops
      - >-
        packages/core/test/formal-r2-apply-persist-nothing-hidden.test.ts::a batch with a clashing id is stored under
        two ids and the rename is an engram_rekeyed event
  packages/core/src/index.ts#startDir:
    kind: guarantee
    rule: A failure of the one-time legacy tension purge never makes the constructor fail.
    none: no test makes the purge fail and checks the constructor still succeeds
  packages/core/src/inject.ts#DEFAULT_PINNED_HARD_RATIO:
    kind: guarantee
    rule: Hard-tier pinned memories never take more than their share of the pinned budget, whatever ratio is configured.
    tests:
      - >-
        packages/core/test/pinned-two-tier-inject.test.ts::the hard tier is capped at its share of the pinned budget and
        the overflow is reported
      - >-
        packages/core/test/pinned-two-tier-inject.test.ts::a non-finite hard ratio falls back to the default instead of
        disabling the cap
  packages/core/src/inject.ts#InjectionContext:
    kind: guarantee
    rule: Scopes granted by mounted stores only widen what is visible; they never widen an explicit allow-list of scopes.
    tests:
      - "packages/core/test/inject-scopes.test.ts::ADVERSARIAL: the grant does NOT widen the options.scopes allow-list"
  packages/core/src/inject.ts#InternalInjectionResult:
    kind: guarantee
    rule: Every pinned memory that was not delivered is listed in the injection result with the reason.
    tests:
      - >-
        packages/core/test/pinned-two-tier-inject.test.ts::hard-tier overflow reaches the injection result instead of
        vanishing
    promises:
      - INJ-6
  packages/core/src/inject.ts#commitment:
    kind: guarantee
    rule: A memory's commitment and its confidence are shown as separate fields; one never replaces the other.
    none: no test checks that both fields render side by side
  packages/core/src/inject.ts#expiredMarker:
    kind: guarantee
    rule: In soft-expiry mode an expired memory that is still delivered always carries the EXPIRED warning.
    tests:
      - >-
        packages/core/test/plur.test.ts::config expiry.mode=soft injects recently-expired engrams with the EXPIRED
        marker
  packages/core/src/inject.ts#fillTokenBudget:
    kind: guarantee
    rule: >-
      The pinned share is taken from the whole injection budget once, not once per section pass; a hard-tier pin that
      does not fit is reported, never dropped silently.
    tests:
      - >-
        packages/core/test/pinned-two-tier-inject.test.ts::hard-tier overflow reaches the injection result instead of
        vanishing
      - packages/core/test/pinned-two-tier-inject.test.ts::a soft pin in an earlier pass cannot spend the hard tier
    promises:
      - INJ-6
  packages/core/src/inject.ts#formatLayer3:
    kind: note
    why: Explains why the meta line says "Last active" rather than "Last verified".
  packages/core/src/inject.ts#hardPinnedReserve:
    kind: note
    why: Records a known limitation of the hard-tier reserve calculation.
  packages/core/src/inject.ts#isConstraintCandidate:
    kind: note
    why: Warns maintainers to keep this predicate in step with the wire-time routing.
  packages/core/src/inject.ts#isInjectVisible:
    kind: guarantee
    rule: A memory outside the visible scopes is never revived by pinning, an embedding boost or spreading activation.
    lean:
      - PlurSpec/ScopeInject.lean:selected_visible
    tests:
      - >-
        packages/core/test/formal-scopeinject-visibility.test.ts::spreading activation does not reach a scope-excluded
        association target
      - >-
        packages/core/test/formal-scopeinject-visibility.test.ts::a semantic-only embedding boost does not revive a
        scope-excluded engram
      - >-
        packages/core/test/formal-scopeinject-visibility.test.ts::a pinned engram in an ungranted shared scope is not
        injected under project scope
    promises:
      - PRV-3
  packages/core/src/inject.ts#isPrimaryRow:
    kind: guarantee
    rule: >-
      A row from a secondary store or pack never hides another store's row through supersession; only the user's primary
      rows can.
    none: no test checks that a store or pack row cannot hide another store's row
  packages/core/src/inject.ts#meta:
    kind: guarantee
    rule: The token estimate for a memory never under-counts a field the renderer prints.
    lean:
      - PlurSpec/ScopeInject.lean:estimate_covers_render
  packages/core/src/inject.ts#metaSafe:
    kind: guarantee
    rule: Pack-controlled text cannot forge extra fields in a memory's meta line.
    tests:
      - >-
        packages/core/test/progressive-disclosure.test.ts::a pack-controlled domain cannot forge the meta line authority
        fields
  packages/core/src/inject.ts#originLines:
    kind: guarantee
    rule: Every delivered memory says which scope it came from, on its own line.
    tests:
      - >-
        packages/core/test/progressive-disclosure.test.ts::formatLayer1 renders the whole statement and its scope, never
        the summary (INJ-7)
    promises:
      - INJ-7
  packages/core/src/inject.ts#pinned:
    kind: guarantee
    rule: Under budget pressure a pack's pinned memory is never admitted ahead of the user's own pinned memory.
    lean:
      - PlurSpec/ScopeInject.lean:pinned_priority
      - PlurSpec/ScopeInject.lean:new_primary_wins
    tests:
      - >-
        packages/core/test/formal-scopeinject-pinned-origin.test.ts::a pack pinned directive does not displace a primary
        pinned constraint
      - packages/core/test/pinned-quota.test.ts::does not admit a lower-origin pin after skipping a higher-origin one
    promises:
      - INJ-6
  packages/core/src/inject.ts#pinnedOriginRank:
    kind: guarantee
    rule: >-
      A pinned row's origin rank comes from the loader, so a row cannot claim to be the user's own by carrying its own
      marker.
    tests:
      - packages/core/test/pinned-quota.test.ts::a row cannot claim primary origin by shipping its own marker
  packages/core/src/inject.ts#remainingAfterSections:
    kind: guarantee
    rule: The whole injection, including the consider pool and spreading activation, never exceeds the token budget.
    lean:
      - PlurSpec/ScopeInject.lean:total_le_budget
    tests:
      - packages/core/test/formal-apply-budget-inject.test.ts::holds across budgets, including tiny ones
    promises:
      - INJ-2
  packages/core/src/inject.ts#scoreEngram:
    kind: guarantee
    rule: >-
      Under a project scope filter, personal scopes and scopes granted by mounted stores stay visible; only shared
      scopes matching neither are excluded.
    tests:
      - packages/core/test/inject-scopes.test.ts::the mounted scope passes a project-scope VISIBILITY filter
      - "packages/core/test/inject-scopes.test.ts::REGRESSION: without a mount the same group scope stays excluded"
  packages/core/src/inject.ts#selectAndSpread:
    kind: guarantee
    rule: A visible pinned memory is delivered even when it shares no keywords with the task.
    lean:
      - PlurSpec/ScopeInject.lean:good_case_reachable
    tests:
      - packages/core/test/inject.test.ts::pinned engram with no keyword overlap survives the minRelevance filter
  packages/core/src/inject.ts#skipForApproval:
    kind: guarantee
    rule: A memory awaiting approval is never given to the agent, though explicit recall still finds it.
    tests:
      - packages/core/test/draft-approval-gate.test.ts::does not inject a draft engram
      - packages/core/test/draft-approval-gate.test.ts::still returns a draft from an explicit recall
    promises:
      - INJ-4
  packages/core/src/inject.ts#skipForValidity:
    kind: guarantee
    rule: >-
      A memory that is not yet valid is never injected, and an expired one is skipped in hard mode or once past the
      grace window.
    tests:
      - packages/core/test/plur.test.ts::learn with future valid_from is skipped by inject (not-yet-valid)
      - packages/core/test/inject.test.ts::hard mode (default) skips recently-expired engrams
      - packages/core/test/inject.test.ts::soft mode still skips engrams expired beyond the grace window
    promises:
      - FDB-5
  packages/core/src/injection-signal.ts#(module):
    kind: guarantee
    rule: >-
      Automatic ratings below the minimum confidence are never sent, and a reply that both rejects and follows a memory
      gets no rating.
    tests:
      - packages/core/test/injection-signal.test.ts::returns only signals at or above the 0.6 threshold
      - packages/core/test/injection-signal.test.ts::a statement first negated, then carried out, gets no verdict
  packages/core/src/injection-signal.ts#AUTO_FEEDBACK_MIN_CONFIDENCE:
    kind: guarantee
    rule: An automatic rating below the minimum confidence is never sent.
    tests:
      - packages/core/test/injection-signal.test.ts::returns only signals at or above the 0.6 threshold
  packages/core/src/injection-signal.ts#correctionMemo:
    kind: note
    why: Explains a memo that keeps the correction check linear on long replies.
  packages/core/src/injection-signal.ts#verdict:
    kind: guarantee
    rule: >-
      A memory is rated negative only when every occurrence is rejected and positive only when none is; a mixed reply
      gets no rating.
    tests:
      - packages/core/test/injection-signal.test.ts::a statement first negated, then carried out, gets no verdict
      - packages/core/test/injection-signal.test.ts::every occurrence rejected is still negative
  packages/core/src/instruction-history.ts#SHIPPED_PLUR_SECTIONS:
    kind: guarantee
    rule: An installer replaces only instruction text PLUR shipped; text a user wrote is never touched.
    tests:
      - packages/cli/test/init-memory-footer.test.ts::a user-edited AGENTS.md section is kept as it was
  packages/core/src/instruction-section.ts#InstructionSectionOptions:
    kind: guarantee
    rule: Instruction text PLUR did not write is never removed from a user's file.
    tests:
      - >-
        packages/core/test/instruction-section.test.ts::a section the user edited is left exactly as it was; the new one
        is added beside it
      - >-
        packages/core/test/instruction-section.test.ts::user prose and a ### subsection after a shipped section at end
        of file survive
  packages/core/src/instruction-section.ts#backupFile:
    kind: guarantee
    rule: >-
      A backup is created exclusively, so two writers never share or overwrite one, and an unchanged file is not backed
      up twice.
    tests:
      - >-
        packages/core/test/instruction-section-write-failure.test.ts::the backup is created exclusively, so two writers
        can never share one
      - >-
        packages/core/test/instruction-section.test.ts::(c) backupFile with once: a second backup of unchanged content
        is not written
  packages/core/src/instruction-section.ts#hiddenLines:
    kind: guarantee
    rule: >-
      Headings or markers inside fenced code or HTML comments are never treated as structure, and when that cannot be
      decided the file is left alone.
    tests:
      - packages/core/test/instruction-section.test.ts::a marker inside a fence does not count as an installed section
      - >-
        packages/core/test/instruction-section-render.test.ts::when it cannot tell whether a block is still open, it
        leaves the file alone and says why
  packages/core/src/instruction-section.ts#tabbed:
    kind: note
    why: Explains why a tab-indented fence is treated as undecidable.
  packages/core/src/instruction-section.ts#writeWithBackup:
    kind: guarantee
    rule: >-
      An instruction file is replaced atomically, never written when it changed since it was read, and a failure leaves
      it untouched; hard links and dangling links are refused.
    tests:
      - >-
        packages/core/test/instruction-section-write-failure.test.ts::a file that changed since the caller read it is
        not written at all
      - >-
        packages/core/test/instruction-section-write-failure.test.ts::a failure while swapping the new file in leaves
        the target untouched and no temp file
      - packages/core/test/instruction-section-write-failure.test.ts::a hard-linked file is not written at all
  packages/core/src/inversion-scan.ts#COMMON_ACTION_VERBS:
    kind: note
    why: Describes the heuristic word list.
  packages/core/src/inversion-scan.ts#InversionSuspect:
    kind: guarantee
    rule: The inversion scan only reports suspects and never rewrites a memory.
    tests:
      - "packages/core/test/inversion-scan.test.ts::is read-only: never mutates the input array or its entries"
  packages/core/src/inversion-scan.ts#LEADING_DIRECTIVE_RE:
    kind: guarantee
    rule: A statement that opens with its directive word is never flagged as a suspected inversion.
    tests:
      - packages/core/test/inversion-scan.test.ts::does not flag a correctly-extracted (post-fix) negation
  packages/core/src/jwt.ts#decodeJwtPayload:
    kind: note
    why: Warns callers that the decoded claims are unverified and only for display.
  packages/core/src/learn-async.ts#LearnAsyncDeps:
    kind: guarantee
    rule: An unscoped save never inherits a server-backed scope from the memory it resembles.
    tests:
      - packages/core/test/learn-async-scope.test.ts::saves an unscoped update of a team memory locally, linked to it
  packages/core/src/learn-async.ts#dedupActor:
    kind: guarantee
    rule: A dedup decision names the model behind it only when the caller said which model; one is never invented.
    none: no test checks the recorded dedup actor
  packages/core/src/learn-async.ts#executeDedupDecision:
    kind: guarantee
    rule: >-
      A merge or update answer from the duplicate check never rewrites the existing memory; it saves a new linked or
      superseding one.
    tests:
      - >-
        packages/core/test/learn-async-scope.test.ts::MERGE leaves the existing engram untouched and saves a linked
        memory
      - >-
        packages/core/test/learn-async-scope.test.ts::UPDATE leaves the existing engram_version and version untouched
        (it supersedes)
    promises:
      - LRN-8
  packages/core/src/learn-async.ts#existing:
    kind: guarantee
    rule: >-
      A changed value is saved as a new memory that supersedes the old one, whose text is never rewritten; a locked
      memory is never superseded automatically and the pair goes to review.
    tests:
      - >-
        packages/core/test/learn-async-scope.test.ts::UPDATE leaves the existing engram_version and version untouched
        (it supersedes)
      - >-
        packages/core/test/learn-update-supersede-stores.test.ts::secondary target locked between the read and the
        write: not superseded, the new one is a draft, review opened
    promises:
      - LRN-6
      - LRN-8
      - LRN-9
  packages/core/src/learn-async.ts#learnAsync:
    kind: guarantee
    rule: >-
      An explicitly scoped save is only deduplicated against memories in the same scope, and similarity never decides
      whether a save is written.
    tests:
      - packages/core/test/learn-async-scope.test.ts::does not dedup an explicitly-scoped write against a global engram
      - packages/core/test/dedup-cosine.test.ts::falls back to ADD and says so when similarity is unavailable
  packages/core/src/learn-async.ts#learnBatch:
    kind: guarantee
    rule: >-
      Batch learning never overwrites an existing memory, caps its AI-check calls while still saving every statement,
      and one failure does not abort the batch.
    tests:
      - >-
        packages/core/test/learn-batch-cap.test.ts::caps LLM dedup calls at maxLlmCalls and still processes every
        statement
      - packages/core/test/batch.test.ts::a caller can map each input to its engram even when a middle item fails (#281)
    promises:
      - LRN-5
      - LRN-8
  packages/core/src/learn-async.ts#result:
    kind: guarantee
    rule: >-
      Batch learning never overwrites an existing memory: a merge becomes a linked new memory and an update a
      superseding one.
    tests:
      - evals/learn/test_promise_LRN8_changed_value_supersedes.test.ts::new memory supersedes, old text kept
    promises:
      - LRN-8
  packages/core/src/learn-async.ts#saveBesideLocked:
    kind: guarantee
    rule: >-
      When the duplicate check says to update a locked memory, the locked memory stays unchanged and the new statement
      is saved as a draft for review, never given to the agent until resolved.
    tests:
      - >-
        packages/core/test/learn-update-supersede-stores.test.ts::secondary target locked between the read and the
        write: not superseded, the new one is a draft, review opened
    promises:
      - LRN-9
  packages/core/src/learn-async.ts#top:
    kind: guarantee
    rule: Similarity is only reported; however close a candidate is, it never stops a save.
    tests:
      - packages/core/test/dedup-cosine.test.ts::never suppresses a write, however similar the closest candidate is
  packages/core/src/learn-async.ts#{ enabled = true, threshold = 0.85, mode = 'llm' }:
    kind: guarantee
    rule: The similarity threshold only decides what is reported; it never blocks a save.
    tests:
      - packages/core/test/dedup-cosine.test.ts::REPORTS a near-duplicate at high similarity but still writes it
  packages/core/src/learner.ts#ALL_PATTERN_GROUPS:
    kind: note
    why: Explains the order in which pattern groups are tried.
  packages/core/src/learner.ts#CORRECTION_PATTERNS:
    kind: guarantee
    rule: >-
      A plain prohibition is never stored as a fragment that reverses its meaning; a genuine "X, not Y" correction keeps
      both halves.
    lean:
      - PlurSpec/ScopeInject.lean:every_negform_keeps_polarity
    tests:
      - packages/core/test/learner.test.ts::does not invert
      - packages/core/test/learner.test.ts::preserves the full contrast for a genuine
  packages/core/src/learner.ts#ML_MARK:
    kind: guarantee
    rule: >-
      The per-reply memory line is never captured as a learning, while a real learning that merely starts with "Memory"
      is kept.
    tests:
      - packages/core/test/learner.test.ts::drops the footer
      - packages/core/test/learner.test.ts::a genuine learning that merely starts with
  packages/core/src/learner.ts#PLACEHOLDER_BULLET_RE:
    kind: guarantee
    rule: A bullet that is only a bracketed template placeholder is never captured as a learning.
    tests:
      - packages/core/test/learner.test.ts::drops placeholder bullets copied verbatim from the injected template (A2)
      - packages/core/test/learner.test.ts::does not drop a real bullet that merely starts with a bracket
  packages/core/src/learner.ts#PREFERENCE_PATTERNS:
    kind: guarantee
    rule: >-
      An extracted always/never rule keeps its directive word and any negation, so it is never stored as its opposite,
      and words like "whenever" do not match.
    lean:
      - PlurSpec/ScopeInject.lean:extract_preserves_polarity
      - PlurSpec/ScopeInject.lean:new_whenever_not_matched
      - PlurSpec/ScopeInject.lean:every_negform_keeps_polarity
    tests:
      - packages/core/test/learner.test.ts::on a prohibition instead of storing its opposite
  packages/core/src/learner.ts#match:
    kind: guarantee
    rule: A real learning that follows the memory line inside the learning block is never lost.
    tests:
      - packages/core/test/learner.test.ts::are kept, and so is what follows them
  packages/core/src/memory-block.ts#renderMemoryBlock:
    kind: guarantee
    rule: When the instructions fit, the rendered memory section never exceeds the remaining token budget.
    lean:
      - PlurSpec/ScopeInject.lean:memBlockNew_le
    tests:
      - >-
        packages/core/test/formal-apply-budget-memblock.test.ts::usedTokens is charged: the whole output stays within
        tokenBudget - usedTokens
    promises:
      - INJ-2
  packages/core/src/normalize-engram.ts#NormalizeRule:
    kind: guarantee
    rule: >-
      Field normalisation is idempotent, runs before parsing, never touches quarantined entries and never mutates its
      input.
    tests:
      - packages/core/test/normalize-engram.test.ts::is idempotent — a migrated record is untouched, by reference
      - packages/core/test/normalize-engram.test.ts::never mutates its input
  packages/core/src/offline.ts#updateCheckDisabledByEnv:
    kind: guarantee
    rule: The update check does not run when PLUR is offline or the check is turned off.
    tests:
      - packages/core/test/offline-no-network.test.ts::the update check makes no network call of any kind
    promises:
      - TEAM-5
  packages/core/src/outbox-health.ts#NEEDS_ACTION_RETRY_MS:
    kind: guarantee
    rule: >-
      An automatic flush retries a write that needs action at most once a day, an explicit flush retries it at once, and
      such entries are never dropped.
    tests:
      - >-
        packages/core/test/outbox-needs-action.test.ts::an automatic flush backs off a needs_action entry; nothing is
        removed or rewritten
      - >-
        packages/core/test/outbox-needs-action.test.ts::an explicit flush (force) retries it; only retry bookkeeping
        changes
  packages/core/src/outbox-health.ts#REFUSAL_TEXT:
    kind: note
    why: Describes the text a server sends when it refuses a write; an assumption about the server.
  packages/core/src/outbox-order.ts#orderBySupersedes:
    kind: guarantee
    rule: >-
      Queued writes caught in a supersedes cycle are still attempted in their original order, never dropped from the
      flush.
    tests:
