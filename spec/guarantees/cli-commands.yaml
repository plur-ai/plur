    tests: ["packages/cli/test/folder-safety-1588.test.ts::folders.yaml is not created by doctor when only trust.yaml exists"]
  packages/cli/src/commands/doctor.ts#printText:
    kind: guarantee
    rule: "With --quiet, doctor drops only its banner; every finding, including the passing lines, still prints."
    tests: ["packages/cli/test/quiet.test.ts::suppresses only the banner; every finding still prints"]
  packages/cli/src/commands/doctor.ts#spawnEnv:
    kind: note
    why: "Explains why the probe uses the entry's own environment."
  packages/cli/src/commands/doctor.ts#spec:
    kind: note
    why: "States a Windows fact: npx and .cmd files cannot be spawned directly."
  packages/cli/src/commands/doctor.ts#staticChecksPass:
