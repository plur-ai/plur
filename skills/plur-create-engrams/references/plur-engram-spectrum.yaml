# PLUR engram spectrum — 19 fully specified teaching examples
# Authored 2026-09-07. Fictional user Mira and fictional projects Luma,
# public talks, and Fieldnotes. No real preferences, approvals, studies,
# benchmark results, or production behavior are claimed.
#
# Read the statement as the useful memory payload; rationale explains its value.
# The example source is embedded, and each record has a positive retrieval case,
# a near-miss case, and a review trigger. These checks are proposed, not executed.
# Every statement AND compact summary retain an EXAMPLE marker. Non-active
# records also retain their modeled state in those two strings.
# These examples have not been installed in an agent memory store.
#
# Coverage:
# 01 recommendation preference       global / pinned / active
# 02 standing value                  global / pinned / active
# 03 context fact                    global / retrieved / active
# 04 creative taste                  global / retrieved / active
# 05 project purpose                 scoped / pinned / active
# 06 project invariant               scoped / pinned / active
# 07 local definition                scoped / retrieved / active
# 08 decision + reopening condition  scoped / retrieved / active
# 09 procedure                       scoped / retrieved / active
# 10 episode                         scoped / retrieved / active
# 11 bounded measurement             scoped / retrieved / active
# 12 hypothesis                      scoped / candidate review
# 13 temporary priority              scoped / pinned / expiring
# 14 lesson                          scoped / retrieved / active
# 15 domain abstraction (ABS)         global / candidate review
# 16 non-software procedure          scoped / retrieved / active
# 17 cross-domain pattern (META)      global / candidate review
# 18 superseded decision             scoped / historical review / retired
# 19 paused intention                scoped / resumption review / dormant
#
# Scope, delivery, content, epistemic standing, and lifecycle are separate axes.
# Global means potentially applicable across projects; it does not mean always
# relevant. Pinned is a delivery preference, not additional authority or evidence.
# A current explicit direction can revise a remembered preference or decision.
#
# Shape: Open Engram Standard v1 working draft, engram object version 2.
# Checked against the pinned schema snapshot below; no claim about fixes
# landing on current main or the behavior of a particular deployment is made.
# https://github.com/plur-ai/plur/blob/1557e14f9953ec97c41ef484723b1a15422b42a8/spec/ENGRAM-STANDARD-v1.md
# https://github.com/plur-ai/plur/blob/1557e14f9953ec97c41ef484723b1a15422b42a8/spec/engram.schema.json
# https://github.com/plur-ai/plur/blob/1557e14f9953ec97c41ef484723b1a15422b42a8/packages/core/src/schemas/meta-engram.ts
#
# PLUR native type values are behavioral, terminological, procedural, and
# architectural. Labels such as preference, episode, hypothesis, and decision
# describe semantic roles, not invented values for the native type field.
# knowledge_type provides the additional native memory-class/cognitive-level axes.
# commitment is decision state; it is not epistemic confidence.
#
# candidate and dormant are schema-accepted reserved/legacy states in this
# snapshot. They are used here to illustrate lifecycle concepts; this file does
# not assert that automatic review or reactivation workflows are implemented.
# META is the informative extension; its complete meta block follows the
# referenced runtime schema. Evidence here means two constructed mappings,
# not two verified episodes. Alignment scores describe role correspondence
# by construction. External validation and composite confidence remain zero.
#
# structured_data.example is author-defined teaching metadata, not a native
# PLUR trigger, quality gate, workflow, or enforcement mechanism. File + JSON
# Pointer knowledge anchors resolve within this document; automatic resolution
# by a PLUR deployment is not asserted. Source text is illustrative evidence.
#
# Unobserved activation, fitness, calibrated confidence, signed provenance,
# runtime event IDs, and learned association weights are omitted. Usage and
# feedback are zero. Optional fields are populated when relevant; defaults and
# unrelated fields are not expanded just to make a record look complete.
# learned_at is this example's authoring date; historical dates and validity
# windows belong to the explicitly fictional scenario.
#
# Example selection design (not a measured runtime trace): before 19 September,
# an eligible Luma session has five pinned examples: 01, 02, 05, 06, 13.
# A usability-planning task can add 09 and 10, then inspect 12 explicitly as a
# hypothesis. A naming task for a different project needs the two global pins
# and may retrieve 04; it does not need Luma's project memories.
# The collection represents a memory bank, not a request to inject all 19.
#
