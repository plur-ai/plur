anchors:
  packages/core/src/reranker-eval.ts#(module):
    kind: guarantee
    rule: a harmful reranker verdict is advisory only and never turns reranking off by itself
    tests:
      - >-
        packages/core/test/reranker-eval.test.ts::logs the harmful advisory ONCE when the env-configured reranker
        engages — and keeps reranking
  packages/core/src/reranker-eval.ts#loadRerankerEvalCache:
    kind: guarantee
    rule: a corrupt or missing reranker eval cache loads as empty instead of throwing
    tests:
      - packages/core/test/reranker-eval.test.ts::tolerates a corrupt cache file (returns empty, does not throw)
      - packages/core/test/reranker-eval.test.ts::missing cache file loads as empty
  packages/core/src/reranker-eval.ts#rerankerEvalAdvisory:
    kind: guarantee
    rule: the reranker advisory only warns; it never disables reranking
    tests:
      - >-
        packages/core/test/reranker-eval.test.ts::logs the harmful advisory ONCE when the env-configured reranker
        engages — and keeps reranking
  packages/core/src/reranker-eval.ts#runRerankerSelfEval:
    kind: guarantee
    rule: a reranker failure during a self-eval run is raised to the caller, never silently swallowed
    tests:
      - packages/core/test/reranker-eval.test.ts::propagates reranker failures instead of silently falling back
  packages/core/src/sanitize.ts#collapseLineTerminators:
    kind: guarantee
    rule: collapsing line terminators removes the entry-forgery boundary and applying it twice gives the same result as once
    tests:
      - packages/core/test/sanitize.test.ts::is idempotent, because the local route sanitises twice
      - packages/core/test/sanitize.test.ts::renders as one entry once sanitised
  packages/core/src/sanitize.ts#SPACES_AROUND_TERMINATORS:
    kind: guarantee
    rule: >-
      every line terminator the memory renderer recognises is collapsed out of a statement, so a statement cannot forge
      a second rendered entry
    tests:
      - packages/core/test/sanitize.test.ts::collapses every terminator the renderer recognises, not just LF
      - packages/core/test/sanitize.test.ts::holds for every terminator in the class, not only the line feed
  packages/core/src/save-destination.ts#formatSaveDestination:
    kind: guarantee
    rule: >-
      a save is reported as on the server only when it was actually delivered there, never because a server is
      configured
    lean:
      - PlurSpec/SaveDestination.lean:confirmed_only
      - PlurSpec/SaveDestination.lean:queued_never_confirmed
    tests:
      - >-
        packages/core/test/save-destination.test.ts::reports delivery from the returned write object, and a failed push
        as queued
  packages/core/src/scope-routing.ts#AutoRouteDecision:
    kind: note
    why: documents what each auto-route action value means; the refusal rule itself lives in decideAutoRoute
  packages/core/src/scope-routing.ts#decideAutoRoute:
    kind: guarantee
    rule: an unscoped write is never auto-routed into a shared scope unless the install opted in
    lean:
      - PlurSpec/WritePath.lean:final_shared_needs_human
    tests:
      - >-
        packages/core/test/route-unscoped.test.ts::refuses a confident SHARED domain match and falls to the unscoped
        default
      - "packages/core/test/route-unscoped.test.ts::every shared prefix is refused, not just group:"
    promises:
      - PRV-4
  packages/core/src/scope-routing.ts#DecideAutoRouteOptions:
    kind: guarantee
    rule: an unscoped write reaches a remote personal scope only when that scope is known to be the user's own namespace
    lean:
      - PlurSpec/WritePath.lean:refused_foreign_remote_personal
      - PlurSpec/ScopeInject.lean:autoRoute_me_only
    tests:
      - >-
        packages/core/test/formal-apply-core-me-only.test.ts::a server-declared personal namespace that is not the
        user's own → refused like shared
      - >-
        packages/core/test/formal-apply-core-me-only.test.ts::allow_shared_auto_route does not unlock a foreign personal
        namespace
  packages/core/src/scope-routing.ts#MAX_KEYWORD_RAW:
    kind: guarantee
    rule: >-
      statement keyword overlap, alone or with one coincidental tag, never clears the auto-route threshold into a shared
      scope
    tests:
      - >-
        packages/core/test/scope-routing.test.ts::keyword-only overlap, however many tokens, does NOT clear the
        auto-route threshold
      - >-
        packages/core/test/scope-routing.test.ts::keyword-coincidence + ONE coincidental tag still does NOT clear the
        threshold
  packages/core/src/scope-routing.ts#scoreScope:
    kind: guarantee
    rule: a reverse domain match or keyword overlap alone never lets a generic engram land in a shared scope
    tests:
      - >-
        packages/core/test/route-unscoped.test.ts::R2-C OVER-ROUTE REGRESSION: a BROAD engram (domain ⊃ cover) does NOT
        deterministically route into a narrow shared scope
      - >-
        packages/core/test/scope-routing.test.ts::keyword-only overlap, however many tokens, does NOT clear the
        auto-route threshold
  packages/core/src/scope-routing.ts#SUGGEST_DISPLAY_MIN_CONFIDENCE:
    kind: note
    why: explains how the default display floor was sized between the one-keyword and two-keyword confidence bands
  packages/core/src/scope-routing.ts#WEIGHT_DOMAIN_REVERSE:
    kind: guarantee
    rule: an engram whose domain is broader than a scope cover never lands in that narrow shared scope on that match alone
    tests:
      - >-
        packages/core/test/route-unscoped.test.ts::R2-C OVER-ROUTE REGRESSION: a BROAD engram (domain ⊃ cover) does NOT
        deterministically route into a narrow shared scope
      - >-
        packages/core/test/scope-routing.test.ts::R2-C: REVERSE direction (domain ⊃ cover) leaves
        coverContainsDomain:false and is down-weighted below threshold
  packages/core/src/scope-target.ts#isLocalOnlyScope:
    kind: guarantee
    rule: >-
      an operation aimed at a local scope (primary, local, global, or a project scope no server claims exactly) never
      reaches a remote store
    lean:
      - PlurSpec/ScopeInject.lean:case_folded
      - PlurSpec/RoutingDiscovery.lean:unclaimed_stays_local
    tests:
      - packages/core/test/formal-apply-core-scope-family.test.ts::the named local targets never depend on stores
      - >-
        packages/core/test/formal-apply-core-scope-family.test.ts::an uncovered project scope still never reaches the
        network
  packages/core/src/scope-target.ts#personalStoreEntry:
    kind: guarantee
    rule: >-
      for a personal user scope, a matching local store is always chosen over a remote one, then a writable remote over
      a readonly one
    tests:
      - >-
        packages/core/test/user-scope-remote-recall.test.ts::three stores sharing one scope: the ownership check
        examines the entry the write lands on
  packages/core/src/scope-util.ts#isPersonalScope:
    kind: guarantee
    rule: >-
      every personal-family scope (local, global, user, agent and any non-shared scope) stays visible under a
      project-scoped recall or inject
    tests:
      - >-
        packages/core/test/read-side-scope-visibility.test.ts::a user:alice-scoped engram IS visible under project-scope
        recall AND inject
      - >-
        packages/core/test/read-side-scope-visibility.test.ts::predicate sanity: personal-family scopes are personal,
        shared are not
      - "packages/core/test/formal-backend-scopes-case.test.ts::PGLite adapter: "
    lean:
      - PlurSpec/BackendScopes.lean:sqlShared_fold
  packages/core/src/scope-util.ts#makeVisibilityPredicate:
    kind: guarantee
    rule: >-
      mounted scopes only widen what a scoped read can see, never what it is authorised to see, and an explicit global
      inject stays limited to global
    lean:
      - PlurSpec/ScopeInject.lean:global_is_targeted
    tests:
      - >-
        packages/core/test/read-side-scope-visibility.test.ts::D1 guard: explicit scope=global INJECT stays targeted —
        grants do NOT leak into it
      - >-
        packages/core/test/read-side-scope-visibility.test.ts::sibling-prefix: the grant does NOT admit
        group:acme/eng-private (#383)
  packages/core/src/scope-util.ts#s:
    kind: note
    why: >-
      explains that only the comparison is case-folded; JavaScript strings are immutable, so the stored value cannot
      change here anyway
  packages/core/src/scope-util.ts#scopeAllowFilter:
    kind: guarantee
    rule: an empty permitted-scope list matches nothing and a non-empty one admits exactly the listed scopes
    tests:
      - >-
        packages/core/test/scope-pushdown.test.ts::SECURITY: an empty list matches NOTHING — it is never widened to "no
        filter"
      - >-
        packages/core/test/scope-pushdown.test.ts::does NOT expand descendants and does NOT pass personal-family scopes
        through
  packages/core/src/scope-util.ts#SHARED_SCOPE_PREFIXES:
    kind: note
    why: >-
      defines which scope prefixes count as shared; the visibility and leak-guard rules are stated where they are
      applied
  packages/core/src/search-orchestrator.ts#runHybrid:
    kind: guarantee
    rule: a search is labelled hybrid only when its semantic leg actually ran
    lean:
      - PlurSpec/R2Retrieval.lean:hybrid_label_truthful
    tests:
      - packages/core/test/formal-r2-retrieval-labels.test.ts::(a) a failed embedder is not reported as a hybrid search
      - "packages/core/test/formal-r2-retrieval-labels.test.ts::(a) embeddings disabled by the user: also not hybrid"
    promises:
      - REC-3
  packages/core/src/secrets.ts#detectSensitive:
    kind: guarantee
    rule: >-
      input over the scan limit is reported as unscanned rather than passed as clean, and cutting it never throws or
      yields invalid text
    tests:
      - >-
        packages/core/test/secrets.test.ts::#386 fail-closed: an input larger than the ceiling reports scan_truncated
        even when the scanned prefix is clean
      - >-
        packages/core/test/secrets.test.ts::truncation at the ceiling produces valid UTF-8 even when it splits a
        multibyte char (no throw)
      - >-
        packages/core/test/formal-secrets-install-truncate.test.ts::detectSensitive scans the cut text and still reports
        the input as truncated
  packages/core/src/secrets.ts#found:
    kind: guarantee
    rule: an invisible character inside a host name or address does not hide it from the sensitive-content scan
    tests:
      - "packages/core/test/secrets.test.ts::detectSensitive: a zero-width space inside an internal host"
      - "packages/core/test/secrets.test.ts::detectSensitive: a zero-width joiner inside a public IP"
  packages/core/src/secrets.ts#host:
    kind: guarantee
    rule: every internal-host match carries the host token, and a match without one is skipped rather than thrown on
    tests:
      - "packages/core/test/secrets.test.ts::alt (a) internal-suffix label: groups.host === host token"
      - "packages/core/test/secrets.test.ts::alt (d) staging inner label: groups.host === host token"
  packages/core/src/secrets.ts#INJECTION_PATTERNS:
    kind: note
    why: says outright that the prompt-injection patterns are a heuristic, not a guarantee
  packages/core/src/secrets.ts#INTERNAL_HOST:
    kind: guarantee
    rule: multi-label internal or staging host names are flagged, but standalone words and public host names never are
    tests:
      - packages/core/test/secrets.test.ts::does NOT flag localhost or standalone infra words
      - packages/core/test/secrets.test.ts::does NOT flag staging as a bare prose word
      - "packages/core/test/secrets.test.ts::alt (a) internal-suffix label: groups.host === host token"
  packages/core/src/secrets.ts#IPV6_CANDIDATE:
    kind: guarantee
    rule: a MAC address or other colon string that is not a valid IPv6 address is never flagged as one
    tests:
      - packages/core/test/secrets.test.ts::does NOT flag a MAC address (six 2-hex groups)
  packages/core/src/secrets.ts#maskFinding:
    kind: guarantee
    rule: >-
      a reported credential finding shows at most its prefix and last four characters, and nothing of a value shorter
      than 16 characters
    tests:
      - packages/core/test/secrets.test.ts::shows the GitHub prefix and last four characters
      - packages/core/test/secrets.test.ts::keeps a keyword assignment to its keyword, and a short value hidden entirely
      - packages/core/test/secrets.test.ts::pack-scan issue details carry only the masked finding
  packages/core/src/secrets.ts#matchInternalHost:
    kind: guarantee
    rule: the internal-host scan loop always advances, so it cannot spin forever on a zero-width match
    lean:
      - PlurSpec/SecretsInstall.lean:loop_terminates
      - PlurSpec/SecretsInstall.lean:nextIndex_advances
  packages/core/src/secrets.ts#percentDecodedView:
    kind: guarantee
    rule: percent-decoding for the credential scan never throws on malformed escapes
    tests:
      - packages/core/test/secrets.test.ts::tolerates malformed percent sequences
      - packages/core/test/secrets.test.ts::flags a GitHub token after a percent-encoded =
  packages/core/src/secrets.ts#SECRET_PATTERNS:
    kind: guarantee
    rule: >-
      a vendor token prefix glued onto the end of a longer word is not reported as a credential, so prose naming a
      prefix stays clean
    tests:
      - packages/core/test/secrets.test.ts::does not flag a GitHub prefix glued onto a longer identifier
      - packages/core/test/secrets.test.ts::does not flag ASIA glued onto a longer word
  packages/core/src/secrets.ts#truncateToScanLimit:
    kind: guarantee
    rule: cutting text to the scan limit never throws and always yields valid text
    tests:
      - >-
        packages/core/test/formal-secrets-install-truncate.test.ts::splitting %s at the limit yields valid text, never
        throwing (offset %i)
      - packages/core/test/formal-secrets-install-truncate.test.ts::returns text at or under the limit unchanged
  packages/core/src/seen-on-server.ts#(module):
    kind: guarantee
    rule: >-
      the seen-on-server record is bounded by rotation, so concurrent appends are never lost, and a failed append never
      blocks the operation
    tests:
      - >-
        packages/core/test/seen-on-server-store.test.ts::S1: concurrent writers lose no line while the file is being
        bounded
    lean:
      - PlurSpec/RemoteHealth.lean:append_survives_one_rotation
      - PlurSpec/RemoteHealth.lean:append_keeps
  packages/core/src/seen-on-server.ts#seenOnServer:
    kind: guarantee
    rule: a damaged seen-on-server record is ignored, never an error
    tests:
      - "packages/core/test/seen-on-server-store.test.ts::S3: a record without a numeric at is ignored"
      - >-
        packages/core/test/seen-on-server-store.test.ts::S3: forget after a 401 is not broken by a damaged record (no
        RangeError)
  packages/core/src/sensitivity-writeback.ts#mergeSensitivityForWriteback:
    kind: guarantee
    rule: >-
      writing config back keeps sensitivity categories this version does not know, unless the server policy was just
      synced
    lean:
      - PlurSpec/StoreEntry.lean:ordinary_keeps_forbid
      - PlurSpec/StoreEntry.lean:authoritative_replaces
      - PlurSpec/StoreEntry.lean:fwd_category_survives
    tests:
      - >-
        packages/core/test/server-entry-writeback-identity.test.ts::an unrelated writeback keeps unknown forbid
        categories and nested keys in scope_settings
      - >-
        packages/core/test/server-entry-writeback-identity.test.ts::an authoritative server update replaces forbid
        inside scope_settings
  packages/core/src/server-discovery.ts#(module):
    kind: guarantee
    rule: a failed, unauthorised or malformed scope answer from the server never replaces a non-empty cached scope list
    lean:
      - PlurSpec/RoutingDiscovery.lean:nonempty_cache_replaced_only_by_ok
      - PlurSpec/RoutingDiscovery.lean:malformed_keeps_cache
    tests:
      - packages/core/test/server-discovery.test.ts::a failed answer never replaces even an empty cache
      - >-
        packages/core/test/server-discovery.test.ts::an empty org_id rejects everything as org-prefix and is degraded: a
        non-empty cache stays
  packages/core/src/server-discovery.ts#acceptDiscoveredScopes:
    kind: guarantee
    rule: scope discovery does no I/O, and an answer that cannot be checked never clears or replaces a non-empty cache
    lean:
      - PlurSpec/RoutingDiscovery.lean:nonempty_cache_replaced_only_by_ok
      - PlurSpec/RoutingDiscovery.lean:kept_is_cached
    tests:
      - packages/core/test/server-discovery.test.ts::503 keeps a non-empty cache
      - >-
        packages/core/test/server-discovery.test.ts::an empty org_id rejects everything as org-prefix and is degraded: a
        non-empty cache stays
  packages/core/src/server-discovery.ts#foldStoresIntoServerEntry:
    kind: guarantee
    rule: folding per-scope entries into the server entry never changes which url and key serve any scope
    lean:
      - PlurSpec/StoreEntry.lean:fold_preserves_routing
    tests:
      - >-
        packages/core/test/register-enterprise-server.test.ts::never drops a scope: every scope served before is served
        after, with the same key and url
      - >-
        packages/core/test/register-enterprise-server.test.ts::keeps an entry with a different token separate and says
        why
  packages/core/src/server-discovery.ts#legacyJwt:
    kind: note
    why: >-
      warns maintainers that recognising a legacy token format is not identity evidence; identity comes from the /me
      answer
  packages/core/src/server-discovery.ts#registerServerEntry:
    kind: guarantee
    rule: registering a server never takes over the personal scope writes another entry holds; it refuses and writes nothing
    tests:
      - >-
        packages/core/test/register-enterprise-server.test.ts::refuses to claim a personal scope another entry already
        serves (another server), writing nothing
  packages/core/src/server-discovery.ts#ScopeHolder:
    kind: guarantee
    rule: an entry named as holding the personal scope shows only the url origin, never a user name, password or key
    tests:
      - >-
        packages/core/test/register-enterprise-server-stale.test.ts::another server holding the personal scope: named by
        origin and scope, no key anywhere
  packages/core/src/server-discovery.ts#ServerRegistration:
    kind: guarantee
    rule: >-
      registration with removal of stale holders is refused, writing nothing, when a holder cannot be removed; with
      keepSignIn an existing sign-in for the server is never replaced
    tests:
      - >-
        packages/core/test/register-enterprise-server-stale.test.ts::when the holder cannot be removed for the caller,
        it refuses and writes nothing
      - >-
        packages/core/test/register-enterprise-server-stale.test.ts::keepSignIn: a sign-in config.yaml holds for the
        server is never replaced; nothing is written
  packages/core/src/server-discovery.ts#si:
    kind: guarantee
    rule: a newly registered entry does not take over personal scope writes that another server or key already serves
    tests:
      - >-
        packages/core/test/register-enterprise-server.test.ts::refuses to claim a personal scope another entry already
        serves (another server), writing nothing
      - >-
        packages/core/test/register-enterprise-server.test.ts::refuses a new writable entry that would outrank a
        readonly entry serving its personal scope with another key
  packages/core/src/server-discovery.ts#SignInHeldError:
    kind: guarantee
    rule: with keepSignIn, a sign-in config.yaml already holds for the server is never replaced
    tests:
      - >-
        packages/core/test/register-enterprise-server-stale.test.ts::keepSignIn: a sign-in config.yaml holds for the
        server is never replaced; nothing is written
  packages/core/src/session-manifest.ts#(module):
    kind: guarantee
    rule: a session manifest never contains engram text, scope names, tags or domains, nor a bare statement hash
    tests:
      - >-
        packages/core/test/session-manifest-audit.test.ts::carries no statement hash a reader could test a guessed text
        against
    promises:
      - PROOF-2
  packages/core/src/session-manifest.ts#computeRecordHash:
    kind: note
    why: explains why the record hash is computed at check time rather than stored next to the data it protects
  packages/core/src/session-scopes.ts#NO_SESSION:
    kind: guarantee
    rule: a caller that says it has no session never inherits the process default scope
    tests:
      - >-
        packages/core/test/formal-apply-core-no-session.test.ts::the registry answers null for NO_SESSION even with a
        process default and keyed registrations
      - >-
        packages/core/test/formal-apply-core-no-session.test.ts::learn(): an unscoped write with NO_SESSION ignores the
        process-default slot
  packages/core/src/session-scopes.ts#SessionScopeRegistry.own:
    kind: guarantee
    rule: a session's own registration never falls back to the process default
    none: no test calls own() directly
  packages/core/src/session-scopes.ts#SessionScopeRegistry.set:
    kind: guarantee
    rule: registering a scope under the no-session sentinel is refused
    tests:
      - >-
        packages/core/test/formal-apply-core-no-session.test.ts::refuses to register a scope under NO_SESSION (it can
        never be read back)
  packages/core/src/storage-adapter.ts#(module):
    kind: guarantee
    rule: >-
      a primary store is never driven as a rebuildable derived index, and a derived index can always be rebuilt from
      YAML
    tests:
      - >-
        packages/core/test/storage-adapter-role.test.ts::refuses a primary-role adapter even if it somehow carries the
        methods
      - packages/core/test/storage-adapter-role.test.ts::narrows an index adapter that implements the rebuild contract
  packages/core/src/storage-adapter.ts#asDerivedIndex:
    kind: guarantee
    rule: a primary store, or an index adapter missing the rebuild methods, is refused rather than called into
    tests:
      - >-
        packages/core/test/storage-adapter-role.test.ts::refuses a primary-role adapter even if it somehow carries the
        methods
      - >-
        packages/core/test/storage-adapter-role.test.ts::refuses an index-role adapter that does not implement the
        rebuild methods
  packages/core/src/storage-adapter.ts#DerivedIndexAdapter:
    kind: note
    why: the presence of the rebuild methods is enforced by the type; the runtime check lives in asDerivedIndex
  packages/core/src/storage-adapter.ts#efSearchFor:
    kind: guarantee
    rule: the vector search depth is never below the requested limit, and operator tuning can raise it but never lower it
    tests:
      - packages/core/test/vector-index-strategy.test.ts::never returns less than the limit, for any limit
      - packages/core/test/vector-index-strategy.test.ts::lets an operator raise the floor but never lower it
  packages/core/src/storage-adapter.ts#ScopeRestriction:
    kind: guarantee
    rule: >-
      an empty permitted-scope list matches nothing and is never widened to unrestricted; a non-empty one is exact
      membership
    tests:
      - "packages/core/test/pglite-scope-pushdown.test.ts::SECURITY: an empty permitted-scope list matches NOTHING"
      - >-
        packages/core/test/pglite-scope-pushdown.test.ts::does NOT expand the hierarchy and does NOT pass personal
        scopes through
  packages/core/src/storage-adapter.ts#StorageAdapter:
    kind: guarantee
    rule: >-
      corpus statistics for keyword scoring are counted exactly under the same scope restriction as the search, or not
      reported at all
    tests:
      - packages/core/test/postgres-bm25-pushdown.test.ts::counts df exactly as termMatches does over the same corpus
      - >-
        packages/core/test/postgres-bm25-pushdown.test.ts::scopes the corpus statistics to the same restriction as the
        search
      - >-
        packages/core/test/postgres-bm25-pushdown.test.ts::refuses to report statistics when rows predate the tokens
        column
  packages/core/src/storage-adapter.ts#StorageFilter:
    kind: guarantee
    rule: mounted-scope grants only widen the visibility filter and never the permitted-scope allow-list
    tests:
      - >-
        packages/core/test/pglite-scope-pushdown.test.ts::SECURITY: grants never widen the scopes authorization
        allow-list
      - "packages/core/test/scope-pushdown.test.ts::#775 SECURITY: grants never widen the scopes authorization allow-list"
  packages/core/src/storage-indexed.ts#IndexedStorage.getDb:
    kind: note
    why: explains that re-running the full YAML sync after a partial backfill is safe
  packages/core/src/storage-indexed.ts#IndexedStorage.loadFiltered:
    kind: guarantee
    rule: an empty permitted-scope list returns nothing from the SQLite index, never everything
    tests:
      - "packages/core/test/scope-pushdown.test.ts::SECURITY: an empty permitted-scope list matches NOTHING"
  packages/core/src/storage-indexed.ts#nsId:
    kind: note
    why: points to the shared id-namespacing rule every loader uses
  packages/core/src/storage-indexed.ts#primaryEngrams:
    kind: guarantee
    rule: a queued remote-only save is never copied into the SQLite index
    tests:
      - packages/core/test/remote-only-derived-copies.test.ts::SQLite IndexedStorage
  packages/core/src/storage-indexed.ts#storeEngrams:
    kind: guarantee
    rule: a queued remote-only save held in a secondary store is never copied into the SQLite index
    tests:
      - >-
        packages/core/test/remote-only-derived-copies.test.ts::the SQLite index leaves a queued save of a secondary
        store out too
  packages/core/src/storage-indexed.ts#within:
    kind: guarantee
    rule: >-
      a scope filter on the SQLite index admits a scope and its true descendants but never a string-prefix sibling, and
      grants never widen the allow-list
    tests:
      - >-
        packages/core/test/scope-pushdown.test.ts::#775: visibilityGrants admit the granted scope AND its true
        descendants under a scope filter
      - "packages/core/test/scope-pushdown.test.ts::#775 SECURITY: grants never widen the scopes authorization allow-list"
      - "packages/core/test/formal-backend-scopes-case.test.ts::SQLite index: "
    lean:
      - PlurSpec/BackendScopes.lean:sqlite_agrees
  "packages/core/src/storage-pglite.ts#{ engrams: unique, renames }":
    kind: guarantee
    rule: two different engrams sharing an id in an index batch are both kept, the later one under a fresh id
    lean:
      - PlurSpec/R2Persist.lean:resolve_no_loss
